  function handleSave() {
    if (!selectedJob || !techName) return;
    if (!selectedJob.jnid) { alert('No job ID found \u2014 select a different job and try again.'); return; }
    if (volume <= 0) { alert('Enter pool volume to save'); return; }
    setSaving(true);
    setSaveResult(null);
    // Ensure jsPDF is loaded before building PDF (fixes intermittent CDN failures on mobile)
    window.ensureJsPdf().then(function(jspdfReady) {
      if (!jspdfReady) { console.warn('jsPDF could not be loaded from any CDN \u2014 saving without PDF'); }
      doSave(jspdfReady);
    });
  }
  function doSave(jspdfReady) {
    var desiredCeil = phCeiling(desired.ta, desired.cya);
    var noteBody = buildNoteBody({
      techName: techName,
      jobContext: jobContext,
      waterSource: waterSource,
      sanitizerType: sanitizerType,
      current: current,
      desired: desired,
      params: PARAMS,
      extraParams: EXTRA_PARAMS,
      getFlag: function(key, val) { return getFlag(key, val, ranges); },
      carbAlk: currentLSI.carbAlk,
      phCeiling: currentCeiling,
      lsi: currentLSI.lsi,
      lsiLabel: currentMeta.label,
      desiredCarbAlk: desiredLSI.carbAlk,
      desiredPhCeiling: desiredCeil,
      desiredLsi: desiredLSI.lsi,
      desiredLsiLabel: desiredMeta.label,
      dosing: dosing,
      chemsAdded: chemsAdded,
      volume: volume
    });
    // ---- Alert evaluation (v0.5.2) ----
    // Out-of-range flag sweep: any reading with flag 'low' or 'high' counts as out-of-range.
    // LSI severe: label is CORROSIVE or SCALE FORMING (LSI outside -0.30 to +0.30).
    var allParamsForAlert = PARAMS.concat(EXTRA_PARAMS);
    var flaggedList = [];
    allParamsForAlert.forEach(function(p){
      var val = current[p.key];
      var flag = getFlag(p.key, val, ranges);
      if (flag === 'low' || flag === 'high') {
        var d = p.decimals || 0;
        var display = d > 0 ? val.toFixed(d) : String(val);
        var label = p.key === 'tds' ? tdsLabel(sanitizerType) : p.label;
        var range = ranges[p.key];
        var rangeStr = range ? (range.min + ' - ' + range.max) : '';
        flaggedList.push({
          label: label,
          value: display,
          flag: flag,
          range: rangeStr
        });
      }
    });
    var outOfRange = flaggedList.length > 0;
    var lsiSevere = (currentMeta.label === 'CORROSIVE' || currentMeta.label === 'SCALE FORMING');
    var lsiBalanced = (currentMeta.label === 'BALANCED');
    // v0.9.0: No alerts for startup, source water, or when LSI is balanced
    var suppressAlert = jobContext === 'startup' || waterSource === 'source' || lsiBalanced;
    var sendAlert = (!suppressAlert && (outOfRange || lsiSevere)) ? 'yes' : 'no';
    // Alert reasons array (forward-compat for Phase 2 leak detection)
    var alertReasonsArr = [];
    if (outOfRange) alertReasonsArr.push('out_of_range');
    if (lsiSevere) alertReasonsArr.push('lsi_' + currentMeta.label.toLowerCase().replace(' ', '_'));
    // Human-readable reason string (Make.com just prints this)
    var displayParts = [];
    if (outOfRange) displayParts.push('Out of Range');
    if (lsiSevere) displayParts.push('LSI ' + currentMeta.label.charAt(0) + currentMeta.label.slice(1).toLowerCase());
    var alertReasonsDisplay = displayParts.join(' + ');
    // Severity: critical when LSI is severe, warning for out-of-range only
    var severityLevel = lsiSevere ? 'critical' : (outOfRange ? 'warning' : 'none');
    // Pre-built HTML <tr> rows for the email template (keeps IML out of Make.com)
    var flaggedValuesHtml = flaggedList.map(function(f){
      var flagTag = f.flag === 'high'
        ? '<span style="color:#c41e3a;font-weight:700">&#9650; HIGH</span>'
        : '<span style="color:#c41e3a;font-weight:700">&#9660; LOW</span>';
      return '<tr>'
        + '<td style="padding:8px;border:1px solid #e5e5e5;">' + f.label + '</td>'
        + '<td style="padding:8px;border:1px solid #e5e5e5;">' + f.value + ' ' + flagTag + '</td>'
        + '<td style="padding:8px;border:1px solid #e5e5e5;">' + f.range + '</td>'
        + '</tr>';
    }).join('');
    // Full reading set — sent every save, Phase 2 (leak detection) writes to data store
    var allReadings = {
      temp: current.temp,
      pH: current.pH,
      ta: current.ta,
      ch: current.ch,
      cya: current.cya,
      tds: current.tds,
      fc: current.fc,
      phos: current.phos,
      carbAlk: currentLSI.carbAlk
    };
    var jobAddress = (selectedJob && selectedJob.address) ? selectedJob.address : '';
    var jobName = (selectedJob && selectedJob.name) ? selectedJob.name : '';
    var readingTimestamp = new Date().toISOString();
    var payload = {
      jnid: selectedJob.jnid,
      note: jsonSafeString(noteBody),
      poolVolume: volume,
      updatePoolGallons: selectedJob.poolGallons > 0 ? 'no' : 'yes',
      sanitizerType: sanitizerType,
      updateSanitizerType: sanitizerSource === 'manual' ? 'yes' : 'no',
      waterSource: waterSource,
      // v0.5.2 alert fields
      sendAlert: sendAlert,
      severityLevel: severityLevel,
      alertReasons: alertReasonsArr.join('|'),
      alertReasonsDisplay: alertReasonsDisplay,
      flaggedValuesHtml: flaggedValuesHtml,
      lsiValue: currentLSI.lsi,
      lsiStatus: currentMeta.label,
      techName: techName,
      jobName: jobName,
      jobAddress: jobAddress,
      readingTimestamp: readingTimestamp,
      allReadings: allReadings,
      reportPdf: buildReportPdf(),
      reportFilename: 'ChemReport_' + jobName.replace(/[^a-zA-Z0-9]/g,'_') + '_' + new Date().toISOString().slice(0,10) + '.pdf',
      companyCamProjectId: (selectedJob && selectedJob.companyCamProjectId) ? selectedJob.companyCamProjectId : '',
      // Filter service fields (v0.8.0)
      filterType: filterType,
      updateFilterType: filterTypeSource === 'manual' ? 'yes' : 'no',
      filterCleanDone: filterCleanDone ? 'yes' : 'no',
      filterBackwash: filterBackwash ? 'yes' : 'no',
      deAmount: (filterType === 'DE' && (filterCleanDone || filterBackwash) && deAmount) ? deAmount : '',
      filterNoteBody: (filterCleanDone || filterBackwash) ? jsonSafeString(buildFilterNote()) : '',
      filterCleanEpoch: filterCleanDone ? Math.floor(Date.now()/1000) : '', // full clean only — backwash does NOT stamp Filter Clean date

    };
    var pdfReady = !!payload.reportPdf;
    var ccLinked = !!payload.companyCamProjectId;

    fetch(WEBHOOK_SAVE, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    })
    .then(function(r){
      if (r.ok) {
        if (pdfReady && ccLinked) { setSaveResult('success_pdf'); }
        else if (pdfReady && !ccLinked) { setSaveResult('success_pdf_nocc'); }
        else { setSaveResult('success_nopdf'); }

      }
      else { setSaveResult('error'); }
      setSaving(false);
    })
    .catch(function(){
      setSaveResult('error');
      setSaving(false);
    });
  }

        dosingHtml += '<div style="font-size:11px;color:#666">'+d.reason+'</div></div>';
      });
      dosingHtml += '</div>';
    }
    var notesHtml = '';
    if (chemsAdded) {
      notesHtml = '<div style="margin-bottom:16px"><div style="font-size:14px;font-weight:700;color:#03417f;border-bottom:2px solid #238baa;padding-bottom:4px;margin-bottom:10px">Service Notes</div>';
      if (chemsAdded) notesHtml += '<div style="margin-bottom:6px"><span style="font-weight:700;color:#03417f">Chemicals Added:</span> '+chemsAdded+'</div>';
      notesHtml += '</div>';
    }
    var sanitizerBadge = '';
    if (sanitizerType) {
      var bc = sanitizerType === 'Salt' ? '#3498db' : '#2ecc71';
      sanitizerBadge = '<div style="text-align:center;margin-bottom:16px"><span style="display:inline-block;padding:4px 14px;border-radius:16px;font-size:13px;font-weight:700;background:'+bc+';color:#fff">'+sanitizerType+' Pool</span></div>';
    }
    var jobHtml = '';
    if (selectedJob) {
      jobHtml = '<div style="font-size:16px;font-weight:700;color:#fff;margin-top:6px">'+selectedJob.name+'</div>';
      if (selectedJob.address) jobHtml += '<div style="font-size:12px;color:rgba(255,255,255,0.7)">'+selectedJob.address+'</div>';
    }
    var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Water Chemistry Report</title>'
      + '<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">'
      + '<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Jost,sans-serif;background:#fff;color:#222;padding:16px;max-width:440px;margin:0 auto}'
      + ' @media print{body{padding:8px}.no-print-btn{display:none!important}}</style></head><body>'
      + '<div class="no-print-btn" style="text-align:center;padding:12px 0;display:flex;gap:10px;justify-content:center"><button onclick="window.print()" style="background:linear-gradient(90deg,#238baa,#03417f);color:#fff;border:none;border-radius:24px;padding:12px 28px;font-size:15px;font-weight:700;font-family:Jost,sans-serif;cursor:pointer;letter-spacing:0.5px">Save as PDF / Print</button><button onclick="window.close()" style="background:#666;color:#fff;border:none;border-radius:24px;padding:12px 28px;font-size:15px;font-weight:700;font-family:Jost,sans-serif;cursor:pointer;letter-spacing:0.5px">Close</button></div>'
      + '<div style="background:linear-gradient(135deg,#03417f 0%,#238baa 100%);padding:20px;border-radius:12px;text-align:center;margin-bottom:20px">'
      + '<img src="'+LOGO_SRC+'" style="height:50px;margin-bottom:8px;mix-blend-mode:screen" />'
      + '<div style="font-size:18px;font-weight:800;color:#fff">Water Chemistry Report</div>'
      + '<div style="font-size:12px;color:rgba(255,255,255,0.8);margin-top:4px">'+dateStr+'</div>'
      + jobHtml + '</div>'
      + sanitizerBadge
      + '<div style="text-align:center;margin-bottom:20px">'
      + '<div style="font-size:12px;color:#666;margin-bottom:4px">Langelier Saturation Index</div>'
      + '<span style="display:inline-block;padding:4px 14px;border-radius:16px;font-weight:800;font-size:14px;color:#fff;background:'+meta.bg+'">'+(currentLSI.lsi>=0?'+':'')+currentLSI.lsi.toFixed(2)+' &#8212; '+meta.label+'</span>'
      + '<div style="font-size:11px;color:#999;margin-top:6px">Carb Alk: '+currentLSI.carbAlk+' | pH Ceiling: '+currentCeiling+'</div></div>'
      + '<div style="margin-bottom:16px"><div style="font-size:14px;font-weight:700;color:#03417f;border-bottom:2px solid #238baa;padding-bottom:4px;margin-bottom:10px">Current Readings</div>'
      + '<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>'
      + '<th style="text-align:left;padding:6px 8px;background:#f0f4f8;font-weight:700;color:#03417f;border-bottom:1px solid #ddd">Parameter</th>'
      + '<th style="text-align:center;padding:6px 8px;background:#f0f4f8;font-weight:700;color:#03417f;border-bottom:1px solid #ddd">Value</th>'
      + '<th style="text-align:center;padding:6px 8px;background:#f0f4f8;font-weight:700;color:#03417f;border-bottom:1px solid #ddd">Status</th>'
      + '</tr></thead><tbody>'+readingsRows+'</tbody></table></div>'
      + dosingHtml + notesHtml
      + '<div style="text-align:center;font-size:12px;color:#999;margin-bottom:8px">Pool Volume: '+volume.toLocaleString()+' gallons</div>'
      + '<div style="text-align:center;padding:16px 0;font-size:11px;color:#999;border-top:1px solid #eee;margin-top:20px">'
      + 'Southwest Pools LLC | swpoolsdfw.com<br>2081 Hutton Drive Suite 101, Carrollton TX 75006 | 469-328-0155</div>'
      + '</body></html>';
    var w = window.open('', '_blank');
    if (w) { w.document.write(html); w.document.close(); }
    else { alert('Please allow popups to view the share report.'); }
  }
  return (
    <div style={S.app}>
      <div style={S.header}><img src={LOGO_SRC} alt="Southwest Pools" style={S.logo} /></div>
      {/* JOB LOOKUP + TECH INFO */}
      <div style={S.sectionCard}>
        <div style={S.sectionTitle}>Job Info</div>
        {selectedJob ? (
          <div>
            <div style={S.jobConfirmed}>
              <div style={S.jobConfirmedName}>{selectedJob.name}</div>
              <div style={S.jobConfirmedAddr}>{selectedJob.address}</div>
              {/* Sanitizer Type Badge */}
              {sanitizerType ? (
                <div style={sanitizerBadgeStyle(sanitizerType)}>
                  {sanitizerType === 'Salt' ? '\u2699\ufe0f' : '\ud83e\uddea'} {sanitizerType} Pool
                  {sanitizerSource === 'jn' && <span style={{fontSize:9,opacity:0.7,marginLeft:4}}>(from JN)</span>}
                </div>
              ) : (
                <div style={{marginTop:4}}>
                  <div style={{fontSize:11,color:B.flagYellow,marginBottom:4}}>Sanitizer type not set in JN</div>
                  <div style={{display:'flex',gap:6}}>
                    <button onClick={function(){setSanitizerType('Chlorine');setSanitizerSource('manual');}} style={{padding:'4px 12px',borderRadius:12,border:'1px solid '+B.chlorineGreen,background:'transparent',color:B.chlorineGreen,fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:"'Jost',sans-serif"}}>Set Chlorine</button>
                    <button onClick={function(){setSanitizerType('Salt');setSanitizerSource('manual');}} style={{padding:'4px 12px',borderRadius:12,border:'1px solid '+B.saltBlue,background:'transparent',color:B.saltBlue,fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:"'Jost',sans-serif"}}>Set Salt</button>
                  </div>
                </div>
              )}
              <button style={S.jobClearBtn} onClick={handleJobClear}>Change Job</button>
            </div>
          </div>
        ) : (
          <div>
            {jobsLoading && <div style={{textAlign:'center',padding:'10px 0',fontSize:12,color:B.teal}}>Loading jobs from JN...</div>}
            {jobsError && <div style={{textAlign:'center',padding:'8px 0'}}><span style={{fontSize:12,color:B.flagRed}}>{jobsError}</span> <button style={Object.assign({},S.jobClearBtn,{color:B.teal})} onClick={loadJobs}>Retry</button></div>}
            {!jobsLoading && !jobsError && (
              <div style={S.jobSearchWrap}>
                <div style={{display:'flex',gap:6,alignItems:'center'}}>
                  <input style={Object.assign({},S.fieldInput,{flex:1})} placeholder={'Search '+jobs.length+' jobs by name...'} value={jobSearch}
                    onChange={function(e){setJobSearch(e.target.value);setShowDropdown(true);}}
                    onFocus={function(){if(jobSearch.length>=2)setShowDropdown(true);}}
                    onBlur={function(){setTimeout(function(){setShowDropdown(false);},200);}}
                  />
                  <button onClick={loadJobs} title="Refresh jobs" style={{background:'transparent',border:'1px solid '+B.navyLight,borderRadius:8,padding:'8px 10px',color:B.teal,cursor:'pointer',fontSize:14,lineHeight:1}}>{'\u21bb'}</button>
                </div>
                {showDropdown && jobResults.length > 0 && (
                  <div style={S.jobDropdown}>
                    {jobResults.slice(0,20).map(function(j,i){
                      return <div key={i} style={Object.assign({},S.jobDropdownItem,{borderBottom:i<Math.min(jobResults.length,20)-1?'1px solid '+B.navy:'none'})}
                        onMouseDown={function(e){e.preventDefault();}}
                        onClick={function(){ handleJobSelect(j); }}
                      >
                        <div style={{fontWeight:700,color:B.white,display:'flex',alignItems:'center',gap:6}}>
                          {j.name}
                          {j.sanitizerType && <span style={Object.assign({},sanitizerBadgeStyle(j.sanitizerType),{fontSize:9,padding:'1px 6px'})}>{j.sanitizerType}</span>}
                        </div>
                        <div style={{fontSize:11,color:B.grayMid,marginTop:2}}>{j.address}</div>
                      </div>;
                    })}
                    {jobResults.length > 20 && <div style={{padding:'8px 12px',fontSize:11,color:B.grayDim,fontStyle:'italic'}}>Showing 20 of {jobResults.length} results — type more to narrow</div>}
                  </div>
                )}
                {showDropdown && jobSearch.length >= 2 && jobResults.length === 0 && (
                  <div style={S.jobDropdown}>
                    <div style={Object.assign({},S.jobDropdownItem,{color:B.grayDim,fontStyle:'italic'})}>No matching jobs found</div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}
        <div style={Object.assign({},S.fieldRow,{marginTop:8})}>
          <div style={S.fieldLabel}>Tech</div>
          <select style={S.fieldSelect} value={techSelect} onChange={function(e){setTechSelect(e.target.value);}}>
            <option value="">Select Tech...</option>
            {TECH_NAMES.map(function(name){return <option key={name} value={name}>{name}</option>;})}
            <option value="other">Other</option>
          </select>
        </div>
        {techSelect === 'other' && (
          <div style={S.fieldRow}>
            <div style={S.fieldLabel}></div>
            <input style={S.fieldInput} placeholder="Enter name" value={techCustom} onChange={function(e){setTechCustom(e.target.value);}} />
          </div>
        )}
        <div style={S.fieldRow}>
          <div style={S.fieldLabel}>Job Type</div>
          <select style={S.fieldSelect} value={jobContext} onChange={function(e){setJobContext(e.target.value);}}>
            <option value="">Select...</option>
            <option value="service">Service</option>
            <option value="startup">Startup</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div style={S.fieldRow}>
          <div style={S.fieldLabel}>Source</div>
          <select style={S.fieldSelect} value={waterSource} onChange={function(e){setWaterSource(e.target.value);}}>
            <option value="pool">Pool Water</option>
            <option value="source">Source Water</option>
          </select>
        </div>
      </div>
      {/* SALT POOL STARTUP WARNING */}
      {sanitizerType === 'Salt' && jobContext === 'startup' && (
        <div style={{background:'#f39c1220',border:'1px solid '+B.flagYellow,margin:'0 12px 12px',borderRadius:14,padding:'12px 16px'}}>
          <div style={{fontSize:13,fontWeight:700,color:B.flagYellow,marginBottom:4}}>{'\u26a0\ufe0f'} Salt Pool — Startup Reminder</div>
          <div style={{fontSize:12,color:B.gray,lineHeight:1.4}}>Do NOT add salt until 30 days post-plaster. The salt cell should remain OFF during the startup period. Test and balance all other chemistry parameters first.</div>
        </div>
      )}
      {/* CHEMISTRY READINGS */}
      <div style={S.card}>
        <div style={S.toggleRow}>
          <div>
            <div style={{fontSize:10,color:B.grayMid,fontWeight:600,marginBottom:4,textTransform:'uppercase',letterSpacing:0.5}}>Adjustments</div>
            <div style={S.toggleGroup}>
              <button style={toggleBtnStyle(mode==='dials')} onClick={function(){setMode('dials');}}>Dials</button>
              <button style={toggleBtnStyle(mode==='custom')} onClick={function(){setMode('custom');}}>Custom</button>
            </div>
          </div>
          <div>
            <div style={S.volLabel}>Pool Volume</div>
            <input style={S.volInput} value={volumeStr} onChange={handleVolumeChange} onBlur={handleVolumeBlur} type="number" />
          </div>
        </div>
        <div style={{display:'flex',marginBottom:4,alignItems:'flex-end'}}>
          <div style={Object.assign({},S.colHeader,{flex:'1 1 0'})}>Current</div>
          <div style={{flex:'1 1 0'}} />
          <div style={{flex:'1 1 0',textAlign:'center'}}>
            <div style={S.colHeader}>Desired</div>
          </div>
        </div>
        {PARAMS.map(function(p){
          var flag = getFlag(p.key, current[p.key], ranges);
          var label = getParamLabel(p);
          var dd = p.decimals||0;
          var desVal = desired[p.key];
          return (
          <div key={p.key} style={S.paramRow}>
            <ParamInput mode={mode} value={current[p.key]} step={p.step} min={p.min} max={p.max} onChange={function(v){updateCurrent(p.key,v);}} decimals={dd} />
            <div style={S.paramLabel}>
              {label}<FlagIndicator flag={flag} />
              {p.showCeiling && <div style={S.subLabel}>pH Ceiling<br/>{currentCeiling}</div>}
              {p.showCarbAlk && <div style={S.subLabel}>{p.subLabel}<br/>{currentLSI.carbAlk}</div>}
            </div>
            <ParamInput mode={mode} value={desVal} step={p.step} min={p.min} max={p.max} onChange={function(v){updateDesired(p.key,v);}} decimals={dd} />
          </div>
        );
        })}
        <div style={S.lsiRow}>
          <div style={{flex:'1 1 0',textAlign:'center'}}><div style={lsiPillStyle(currentMeta.bg)}>{currentLSI.lsi.toFixed(2)}</div></div>
          <div style={S.lsiLabel}>LSI</div>
          <div style={{flex:'1 1 0',textAlign:'center'}}><div style={lsiPillStyle(desiredMeta.bg)}>{desiredLSI.lsi.toFixed(2)}</div></div>
        </div>
        <div style={S.separator} />
        {EXTRA_PARAMS.map(function(p){
          var flag = getFlag(p.key, current[p.key], ranges);
          var dd = p.decimals||0;
          var desVal = desired[p.key];
          return (
          <div key={p.key} style={S.paramRow}>
            <ParamInput mode={mode} value={current[p.key]} step={p.step} min={p.min} max={p.max} onChange={function(v){updateCurrent(p.key,v);}} decimals={dd} />
            <div style={S.paramLabel}>{p.label}<FlagIndicator flag={flag} /></div>
            <ParamInput mode={mode} value={desVal} step={p.step} min={p.min} max={p.max} onChange={function(v){updateDesired(p.key,v);}} decimals={dd} />
          </div>
        );
        })}
      </div>
      {/* TABS */}
      <div style={S.tabBar}>
        <button style={tabBtnStyle(tab==='dosing')} onClick={function(){setTab('dosing');}}>Dosing</button>
        <button style={tabBtnStyle(tab==='startup')} onClick={function(){setTab('startup');}}>Startup</button>
        <button style={tabBtnStyle(tab==='factors')} onClick={function(){setTab('factors');}}>Factors</button>
        <button style={tabBtnStyle(tab==='info')} onClick={function(){setTab('info');}}>LSI Info</button>
        <button style={tabBtnStyle(tab==='volume')} onClick={function(){setTab('volume');}}>Volume</button>
      </div>
      <div style={S.tabContent}>
        {tab==='dosing' && <div>
          {dosing.length===0 && <div style={Object.assign({},S.doseItem,{textAlign:'center'})}><div style={Object.assign({},S.doseChem,{color:'#5cb85c'})}>Water is balanced</div></div>}
          {dosing.map(function(d,i){return <div key={i} style={S.doseItem}><div style={S.doseChem}>{d.chem}</div>{d.amount!=null && <div style={S.doseAmt}>{d.amount} {d.unit}</div>}<div style={S.doseReason}>{d.reason}</div></div>;})}
        </div>}
        {tab==='startup' && <div>
          <div style={{fontSize:12,color:B.grayMid,marginBottom:10}}>Orenda product doses scaled to {volume.toLocaleString()} gal</div>
          {/* Salt startup warning in startup tab */}
          {sanitizerType === 'Salt' && (
            <div style={Object.assign({},S.startupItem,{border:'1px solid '+B.saltBlue,background:B.saltBlue+'15'})}>
              <div style={Object.assign({},S.startupName,{color:B.saltBlue})}>{'\u26a0\ufe0f'} Salt Pool Startup</div>
              <div style={{fontSize:12,color:B.gray,marginTop:4}}>Do NOT add salt until 30 days post-plaster. Keep the salt cell OFF during the entire startup period. Balance all other chemistry parameters first, then add salt gradually after the 30-day mark.</div>
            </div>
          )}
          {startupRecs.map(function(r,i){return <div key={i} style={S.startupItem}><div style={S.startupName}>{r.name}</div><div style={S.startupDose}>{r.dose}</div><div style={S.startupNote}>{r.note}</div></div>;})}
          <div style={Object.assign({},S.startupItem,{border:'1px solid '+B.tealDim,background:'transparent'})}>
            <div style={Object.assign({},S.startupName,{color:'#f0ad4e'})}>DFW Note {'\u2014'} Phosphates</div>
            <div style={{fontSize:12,color:B.gray,marginTop:4}}>North Texas tap water often contains 300{'\u2013'}600+ ppb phosphates. Test and treat with CV-600/700 or PR-10,000 as needed during fill.</div>
          </div>
        </div>}
        {tab==='factors' && <div>
          <div style={{fontSize:12,color:B.grayMid,marginBottom:8}}>LSI = pH + TF + CF + AF - 12.1</div>
          <div style={{display:'flex',gap:12}}>
            <div style={{flex:1}}>
              <div style={Object.assign({},S.colHeader,{marginBottom:8})}>Current</div>
              <div style={S.factorRow}><span>pH</span><span style={S.factorVal}>{current.pH.toFixed(1)}</span></div>
              <div style={S.factorRow}><span>Temp Factor</span><span style={S.factorVal}>{currentLSI.TF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Calcium Factor</span><span style={S.factorVal}>{currentLSI.CF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Alk Factor</span><span style={S.factorVal}>{currentLSI.AF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Carb Alk</span><span style={S.factorVal}>{currentLSI.carbAlk}</span></div>
              <div style={Object.assign({},S.factorRow,{borderTop:'1px solid '+B.navyLight,paddingTop:6,marginTop:4})}><span style={{fontWeight:700}}>LSI</span><span style={{fontWeight:800,color:currentMeta.color}}>{currentLSI.lsi.toFixed(2)}</span></div>
            </div>
            <div style={{width:1,background:B.navyLight}} />
            <div style={{flex:1}}>
              <div style={Object.assign({},S.colHeader,{marginBottom:8})}>Desired</div>
              <div style={S.factorRow}><span>pH</span><span style={S.factorVal}>{desired.pH.toFixed(1)}</span></div>
              <div style={S.factorRow}><span>Temp Factor</span><span style={S.factorVal}>{desiredLSI.TF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Calcium Factor</span><span style={S.factorVal}>{desiredLSI.CF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Alk Factor</span><span style={S.factorVal}>{desiredLSI.AF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Carb Alk</span><span style={S.factorVal}>{desiredLSI.carbAlk}</span></div>
              <div style={Object.assign({},S.factorRow,{borderTop:'1px solid '+B.navyLight,paddingTop:6,marginTop:4})}><span style={{fontWeight:700}}>LSI</span><span style={{fontWeight:800,color:desiredMeta.color}}>{desiredLSI.lsi.toFixed(2)}</span></div>
            </div>
          </div>
        </div>}
        {tab==='info' && <div>
          <div style={{fontSize:13,fontWeight:700,color:B.white,marginBottom:10}}>LSI Color Guide</div>
          <div style={S.infoRow}><div style={infoDotStyle('#9b59b6')} /><div style={S.infoText}><div style={S.infoLabel}>Purple {'\u2014'} Scale Forming ({'\u2265'} +0.31)</div>Over-saturated with calcium carbonate. Scale will form on surfaces and equipment.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#5cb85c')} /><div style={S.infoText}><div style={S.infoLabel}>Green {'\u2014'} Ideal Balance (0.00 to +0.30)</div>Water is happy. Slightly positive LSI protects plaster. This is the target zone.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#f0ad4e')} /><div style={S.infoText}><div style={S.infoLabel}>Yellow {'\u2014'} Acceptable (-0.30 to -0.01)</div>Slightly under-saturated. pH will naturally rise toward green over time.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#d9534f')} /><div style={S.infoText}><div style={S.infoLabel}>Red {'\u2014'} Corrosive ({'\u2264'} -0.31)</div>Aggressive water. Will etch plaster, corrode metal, and damage equipment.</div></div>
          <div style={{marginTop:12,fontSize:11,color:B.grayDim,lineHeight:1.5}}>LSI = pH + TF + CF + AF - 12.1. Factors derived from PHTA lookup tables.</div>
        </div>}
        {tab==='volume' && <div>
          <div style={{fontSize:13,fontWeight:700,color:B.white,marginBottom:10}}>Pool Volume Estimator</div>
          <div style={{fontSize:11,color:B.grayMid,marginBottom:12}}>Select pool shape, then adjust values to estimate volume.</div>
          <div style={{display:'flex',gap:6,marginBottom:14}}>
            {[['circle','Circle'],['oblong','Oblong'],['rect','Rectangle']].map(function(arr){
              var k=arr[0],lbl=arr[1];
              return <button key={k} onClick={function(){setVolShape(k);}} style={{flex:1,padding:'8px 4px',borderRadius:8,border:'1px solid '+(volShape===k?B.teal:B.navyLight),background:volShape===k?B.teal:'transparent',color:volShape===k?B.white:B.grayMid,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:"'Jost',sans-serif"}}>{lbl}</button>;
            })}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {volShape==='circle' && <Fragment><VolField label="Radius (R)" value={volInputs.radius} onChange={function(v){updateVolInput('radius',v);}} /><VolField label="Avg Depth" value={volInputs.avgDepth} onChange={function(v){updateVolInput('avgDepth',v);}} step={0.5} /></Fragment>}
            {volShape==='oblong' && <Fragment><VolField label="Length (L)" value={volInputs.length} onChange={function(v){updateVolInput('length',v);}} /><VolField label="Large Diameter (A)" value={volInputs.diamA} onChange={function(v){updateVolInput('diamA',v);}} /><VolField label="Small Diameter (B)" value={volInputs.diamB} onChange={function(v){updateVolInput('diamB',v);}} /><VolField label="Deep Depth" value={volInputs.deepDepth} onChange={function(v){updateVolInput('deepDepth',v);}} step={0.5} /><VolField label="Shallow Depth" value={volInputs.shallowDepth} onChange={function(v){updateVolInput('shallowDepth',v);}} step={0.5} /></Fragment>}
            {volShape==='rect' && <Fragment><VolField label="Length (L)" value={volInputs.length} onChange={function(v){updateVolInput('length',v);}} /><VolField label="Width (W)" value={volInputs.width} onChange={function(v){updateVolInput('width',v);}} /><VolField label="Deep Depth" value={volInputs.deepDepth} onChange={function(v){updateVolInput('deepDepth',v);}} step={0.5} /><VolField label="Shallow Depth" value={volInputs.shallowDepth} onChange={function(v){updateVolInput('shallowDepth',v);}} step={0.5} /></Fragment>}
          </div>
          <div style={{textAlign:'center',margin:'18px 0 10px'}}><div style={{fontSize:28,fontWeight:800,color:B.teal}}>{Number(calcVol).toLocaleString()}</div><div style={{fontSize:13,color:B.grayMid}}>gallons</div></div>
          <button onClick={function(){setVolume(Math.round(calcVol));setTab('dosing');}} style={Object.assign({},S.calcBtn,{margin:'8px auto 4px',padding:'10px',fontSize:14})}>Use This Volume</button>
        </div>}
      </div>
      {/* FIELD REPORT SECTION */}
      <div style={S.sectionCard}>
        <div style={S.sectionTitle}>Field Report</div>
        <div style={S.fieldRow}>
          <div style={S.fieldLabel}>Chemicals Added</div>
        </div>
        <textarea style={Object.assign({},S.textArea,{marginBottom:10})} placeholder="List chemicals added and amounts..." value={chemsAdded} onChange={function(e){setChemsAdded(e.target.value);}} rows={3} />
      </div>
      {/* FILTER SERVICE SECTION */}
      {selectedJob && (
        <div style={S.sectionCard}>
          <div style={S.sectionTitle}>Filter Service</div>
          {/* Filter Type */}
          <div style={S.fieldRow}>
            <div style={S.fieldLabel}>Filter Type</div>
            {filterType ? (
              <div style={{flex:1,display:'flex',alignItems:'center',gap:8}}>
                <div style={{flex:1,fontSize:14,fontWeight:700,color:B.white}}>
                  {filterType}
                  {filterTypeSource === 'jn' && <span style={{fontSize:9,opacity:0.5,marginLeft:6}}>(from JN)</span>}
                </div>
                <button style={{background:'transparent',border:'1px solid '+B.navyLight,borderRadius:8,padding:'4px 10px',color:B.teal,cursor:'pointer',fontSize:11,fontFamily:"'Jost',sans-serif"}} onClick={function(){setFilterType('');setFilterTypeSource('manual');}}>Change</button>
              </div>
            ) : (
              <select style={S.fieldSelect} value={filterType} onChange={function(e){setFilterType(e.target.value);setFilterTypeSource('manual');}}>
                <option value="">Select...</option>
                <option value="Cartridge">Cartridge</option>
                <option value="DE">DE</option>
                <option value="Sand">Sand</option>
              </select>
            )}
          </div>
          {/* Last Filter Clean date from JN */}
          {lastFilterClean && (
            <div style={{fontSize:11,color:B.grayMid,marginBottom:8,paddingLeft:2}}>
              Last Clean: <span style={{color:B.teal,fontWeight:600}}>{new Date(lastFilterClean).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>
            </div>
          )}
          {/* Filter Clean checkbox */}
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8,padding:'10px 12px',background:filterCleanDone?B.teal+'20':B.navyLight,borderRadius:8,border:filterCleanDone?'1px solid '+B.teal:'1px solid transparent',cursor:'pointer'}} onClick={function(){setFilterCleanDone(!filterCleanDone);if(filterCleanDone){setFilterBackwash(false);setDeAmount('');}}}>
            <div style={{width:22,height:22,borderRadius:6,border:'2px solid '+(filterCleanDone?B.teal:B.grayDim),background:filterCleanDone?B.teal:'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              {filterCleanDone && <span style={{color:B.white,fontSize:14,fontWeight:800}}>{'✓'}</span>}
            </div>
            <div>
              <div style={{fontSize:14,fontWeight:600,color:B.white}}>Filter Clean</div>
              <div style={{fontSize:11,color:B.grayMid}}>Mark filter as cleaned today</div>
            </div>
          </div>
          {/* Backwash option — DE filters only */}
          {filterType === 'DE' && (
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8,padding:'10px 12px',background:filterBackwash?B.teal+'20':B.navyLight,borderRadius:8,border:filterBackwash?'1px solid '+B.teal:'1px solid transparent',cursor:'pointer'}} onClick={function(){setFilterBackwash(!filterBackwash);}}>
              <div style={{width:22,height:22,borderRadius:6,border:'2px solid '+(filterBackwash?B.teal:B.grayDim),background:filterBackwash?B.teal:'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                {filterBackwash && <span style={{color:B.white,fontSize:14,fontWeight:800}}>{'✓'}</span>}
              </div>
              <div>
                <div style={{fontSize:14,fontWeight:600,color:B.white}}>Backwash</div>
                <div style={{fontSize:11,color:B.grayMid}}>DE filter backwash performed</div>
              </div>
            </div>
          )}
          {/* DE Amount — shown when DE filter and clean or backwash checked */}
          {filterType === 'DE' && (filterCleanDone || filterBackwash) && (
            <div style={S.fieldRow}>
              <div style={S.fieldLabel}>DE Added</div>
              <div style={{flex:1,display:'flex',alignItems:'center',gap:6}}>
                <input style={Object.assign({},S.fieldInput,{width:80,flex:'0 0 auto',textAlign:'center'})} type="number" inputMode="decimal" placeholder="0" value={deAmount} onChange={function(e){setDeAmount(e.target.value);}} />
                <span style={{fontSize:12,color:B.grayMid}}>lbs</span>
              </div>
            </div>
          )}
        </div>
      )}

      {/* SAVE BUTTON */}
      {(saveResult === 'success_pdf' || saveResult === 'success_pdf_nocc' || saveResult === 'success_nopdf') && (
        <div style={{textAlign:'center',margin:'12px auto 8px'}}>
          <div style={{color:B.flagGreen,fontSize:18,fontWeight:700}}>Saved to JN</div>
          <div style={{fontSize:12,color:B.grayMid,marginTop:4}}>Chemistry report created for {selectedJob ? selectedJob.name : ''}</div>
          {saveResult === 'success_pdf'
            ? <div style={{fontSize:11,color:B.flagGreen,marginTop:3}}>PDF report uploaded to CompanyCam</div>
            : saveResult === 'success_pdf_nocc'
            ? <div style={{fontSize:11,color:B.flagYellow,marginTop:3}}>PDF generated — no CompanyCam project linked to this job</div>
            : <div style={{fontSize:11,color:B.flagYellow,marginTop:3}}>Note saved — PDF could not be generated (check internet connection)</div>
          }

        </div>
      )}
      {saveResult !== 'success_pdf' && saveResult !== 'success_pdf_nocc' && saveResult !== 'success_nopdf' && (
        <button
          style={(!selectedJob || !techName || saving) ? S.disabledBtn : S.calcBtn}
          disabled={!selectedJob || !techName || saving}
          onClick={handleSave}
        >
          {saving ? 'Saving...' : !selectedJob ? 'Select a Job to Save' : !techName ? 'Select a Tech to Save' : 'Save to JN'}
        </button>
      )}
      {saveResult === 'error' && <div style={{textAlign:'center',fontSize:12,color:B.flagRed,marginBottom:8}}>Save failed — check connection and try again</div>}
      {/* Share Report — always available for consultations */}
      <button onClick={function(){ openShareReport(); }} style={Object.assign({},S.calcBtn,{margin:'4px auto 4px',background:'linear-gradient(90deg, #2ecc71 0%, #27ae60 100%)'})}>
        Share Report with Homeowner
      </button>
      <div style={{textAlign:'center',padding:'8px 0 20px',fontSize:10,color:B.grayDim}}>SWP Chemistry App v0.9.4{!window.jspdf && <span style={{color:B.flagYellow}}> (PDF lib loading...)</span>}</div>
    </div>
  );
}
var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(SWPChemistryApp));
</script>
</body>
</html>
