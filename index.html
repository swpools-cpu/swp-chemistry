function getRanges(sanitizerType) {
  var base = {
    pH:   {min:7.2, max:7.8},
    ta:   {min:60,  max:120},
    ch:   {min:200, max:400},
    cya:  {min:30,  max:50},
    fc:   {min:1.0, max:4.0},
    phos: {min:0,   max:500},
  };
  if (sanitizerType === 'Salt') {
    base.tds = {min:2700, max:3400};
  } else {
    base.tds = {min:0, max:3000};
  }
  return base;
}

function jsonSafeString(str) {
  return str
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t');
}

function buildNoteBody(opts) {
  var now = new Date();
  var dateStr = (now.getMonth()+1)+'/'+now.getDate()+'/'+now.getFullYear()+' '+now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  var jobTypes = {nc:'New Construction',remodel:'Remodel',service:'Service',startup:'Startup'};
  var lines = [];
  lines.push('=== SWP Chemistry Report ===');
  lines.push('Date: '+dateStr);
  if (opts.techName) lines.push('Tech: '+opts.techName);
  if (opts.jobContext) lines.push('Job Type: '+(jobTypes[opts.jobContext]||opts.jobContext));
  if (opts.sanitizerType) lines.push('Sanitizer: '+opts.sanitizerType);
  lines.push('');
  lines.push('-- Current Readings --');
  var allParams = opts.params.concat(opts.extraParams);
  allParams.forEach(function(p){
    var val = opts.current[p.key];
    var d = p.decimals || 0;
    var display = d > 0 ? val.toFixed(d) : String(val);
    var flag = opts.getFlag(p.key, val);
    var flagStr = flag === 'ok' ? ' [OK]' : flag === 'high' ? ' [HIGH]' : flag === 'low' ? ' [LOW]' : '';
    var label = p.key === 'tds' ? (opts.sanitizerType === 'Salt' ? 'Salt Level' : 'TDS') : p.label;
    lines.push(label+': '+display+flagStr);
  });
  lines.push('');
  lines.push('Carb Alk: '+opts.carbAlk);
  lines.push('pH Ceiling: '+opts.phCeiling);
  lines.push('LSI: '+(opts.lsi >= 0 ? '+' : '')+opts.lsi.toFixed(2)+' ('+opts.lsiLabel+')');
  lines.push('');
  if (opts.dosing.length > 0) {
    lines.push('-- Dosing Recommendations --');
    opts.dosing.forEach(function(d){
      var amtStr = d.amount != null ? d.amount+' '+d.unit+' -- ' : '';
      lines.push('- '+d.chem+': '+amtStr+d.reason);
    });
    lines.push('');
  }
  lines.push('-- Field Report --');
  if (opts.chemsAdded) lines.push('Chemicals Added: '+opts.chemsAdded);
  lines.push('Backwashed: '+(opts.backwashed ? 'Yes' : 'No'));
  if (opts.filterType) lines.push('Filter Type: '+opts.filterType);
  if (opts.psiVal) lines.push('PSI: '+opts.psiVal);
  if (opts.notes) lines.push('Notes: '+opts.notes);
  lines.push('');
  lines.push('Pool Volume: '+opts.volume.toLocaleString()+' gal');
  return lines.join('\n');
}

function getFlag(key, value, ranges) {
  var range = ranges[key];
  if (!range) return null;
  if (key === 'tds' && value === 0) return null;
  if (value < range.min) return 'low';
  if (value > range.max) return 'high';
  return 'ok';
}

function flagColor(flag) {
  if (flag === 'ok') return B.flagGreen;
  if (flag === 'low' || flag === 'high') return B.flagRed;
  return 'transparent';
}

function interp(table, val) {
  var v = Math.max(table[0][0], Math.min(table[table.length-1][0], val));
  for (var i = 0; i < table.length - 1; i++) {
    if (v >= table[i][0] && v <= table[i+1][0]) {
      var t = (v - table[i][0]) / (table[i+1][0] - table[i][0]);
      return +(table[i][1] + t * (table[i+1][1] - table[i][1])).toFixed(3);
    }
  }
  return table[table.length-1][1];
}

  { key:'temp', label:'Water \u00b0F', min:32, max:105, step:1, dflt:70, lsiParam:true },

  { key:'ta', label:'Total Alkalinity', min:0, max:800, step:5, dflt:90, lsiParam:true, showCarbAlk:true, subLabel:'Carbonate Alkalinity' },
  { key:'ch', label:'Calcium', min:0, max:1000, step:10, dflt:350, lsiParam:true },

];

  { key:'fc', label:'Chlorine', min:0, max:20, step:0.25, dflt:3.5, decimals:2 },
  { key:'phos', label:'Phosphate', min:0, max:5000, step:100, dflt:0 },
];

function calcLSI(vals) {
  var carbAlk = Math.max(vals.ta - Math.round(vals.cya / 3), 5);
  var TF = interp(TEMP_TABLE, vals.temp);
  var CF = interp(CH_TABLE, Math.max(vals.ch, 5));
  var AF = interp(TA_TABLE, Math.max(carbAlk, 5));
  var lsi = +(vals.pH + TF + CF + AF - 12.1).toFixed(2);
  return { lsi:lsi, TF:TF, CF:CF, AF:AF, carbAlk:carbAlk };
}

function calcDosing(current, desired, volume, sanitizerType) {
  var vf = volume / 10000;
  var carbAlk = Math.max(current.ta - Math.round(current.cya / 3), 5);
  var recs = [];
  if (current.pH > desired.pH + 0.05) {
    var pHDrop = current.pH - desired.pH;
    var acidDose = +(pHDrop * (5.317 + 0.2495 * carbAlk) * vf).toFixed(2);
    recs.push({ chem:'Muriatic Acid (31.45%)', amount:acidDose, unit:'fl oz', reason:'Lower pH ' + current.pH.toFixed(1) + ' \u2192 ' + desired.pH.toFixed(1) });
  }
  if (current.pH < desired.pH - 0.05) {
    recs.push({ chem:'Soda Ash (Na\u2082CO\u2083)', amount:+(((desired.pH - current.pH)/0.1)*0.502*vf).toFixed(2), unit:'lbs', reason:'Raise pH ' + current.pH.toFixed(1) + ' \u2192 ' + desired.pH.toFixed(1) });
  }
  if (current.ta < desired.ta - 5) {
    recs.push({ chem:'Sodium Bicarbonate', amount:+(((desired.ta - current.ta)/10)*1.4*vf).toFixed(2), unit:'lbs', reason:'Raise TA ' + current.ta + ' \u2192 ' + desired.ta + ' ppm' });
  }
  if (current.ta > desired.ta + 20) {
    recs.push({ chem:'Muriatic Acid + Aerate', amount:null, unit:'', reason:'TA ' + current.ta + ' is high \u2014 add acid & aerate to degas CO\u2082' });
  }
  if (current.ch < desired.ch - 25) {
    recs.push({ chem:'Calcium Chloride (94%)', amount:+(((desired.ch - current.ch)/10)*1.004*vf).toFixed(2), unit:'lbs', reason:'Raise CH ' + current.ch + ' \u2192 ' + desired.ch + ' ppm' });
  }
  if (current.cya < desired.cya - 5) {
    recs.push({ chem:'CYA / Stabilizer', amount:+(((desired.cya - current.cya)/10)*0.833*vf).toFixed(2), unit:'lbs', reason:'Raise CYA ' + current.cya + ' \u2192 ' + desired.cya + ' ppm' });
  }
  if (current.fc < desired.fc - 0.5) {
    recs.push({ chem:'Cal-Hypo (65-68%)', amount:+((desired.fc - current.fc)*2.07*vf).toFixed(2), unit:'oz', reason:'Raise FC ' + current.fc.toFixed(1) + ' \u2192 ' + desired.fc.toFixed(1) + ' ppm' });
  }
  // Salt dosing — only for salt pools
  if (sanitizerType === 'Salt' && current.tds < desired.tds - 200) {
    recs.push({ chem:'Pool Salt (NaCl)', amount:+(((desired.tds - current.tds)/100)*8.345*vf).toFixed(1), unit:'lbs', reason:'Raise salt ' + current.tds + ' \u2192 ' + desired.tds + ' ppm' });
  }
  return recs;
}

function lsiMeta(lsi) {
  if (lsi <= -0.31) return { label:'CORROSIVE', color:'#d9534f', bg:'#d9534f' };
  if (lsi <= -0.01) return { label:'ACCEPTABLE', color:'#f0ad4e', bg:'#f0ad4e' };
  if (lsi <= 0.30) return { label:'BALANCED', color:'#5cb85c', bg:'#5cb85c' };
  return { label:'SCALE FORMING', color:'#9b59b6', bg:'#9b59b6' };
}

function phCeiling(ta, cya) {
  var carbAlk = Math.max(ta - Math.round(cya / 3), 5);
  return +(Math.min(8.4, 7.5 + (carbAlk - 80) * 0.005)).toFixed(2);
}

function tdsLabel(sanitizerType) {
  return sanitizerType === 'Salt' ? 'Salt Level' : 'TDS';
}

function DialInput(props) {
  var lo = Math.max(props.min, +(props.value - props.step).toFixed(4));
  var hi = Math.min(props.max, +(props.value + props.step).toFixed(4));
  var d = props.decimals || 0;
  var fmt = function(v) { return d > 0 ? v.toFixed(d) : String(v); };
  return (<div style={S.dialGroup}>
    <div style={S.dialSide} onClick={function(){props.onChange(lo);}}>{fmt(lo)}</div>
    <div style={S.dialCenter}>{fmt(props.value)}</div>
    <div style={S.dialSide} onClick={function(){props.onChange(hi);}}>{fmt(hi)}</div>
  </div>);
}

function CustomInput(props) {
  var d = props.decimals || 0;
  var fmt = function(v) { return d > 0 ? v.toFixed(d) : String(v); };
  var _ds = useState(fmt(props.value)), displayVal = _ds[0], setDisplayVal = _ds[1];
  useEffect(function(){ setDisplayVal(fmt(props.value)); }, [props.value]);
  return (<div style={S.customGroup}>
    <button style={S.arrowBtn} onClick={function(){props.onChange(Math.max(props.min, +(props.value - props.step).toFixed(4)));}}>{'\u2039'}</button>
    <input style={S.customInput} value={displayVal}
      onChange={function(e){ setDisplayVal(e.target.value); }}
      onBlur={function(){
        var v = parseFloat(displayVal);
        if (!isNaN(v) && v >= props.min && v <= props.max) { props.onChange(+(v.toFixed(d))); }
        else { setDisplayVal(fmt(props.value)); }
      }}
      type="number" inputMode="decimal" />
    <button style={S.arrowBtn} onClick={function(){props.onChange(Math.min(props.max, +(props.value + props.step).toFixed(4)));}}>{'\u203a'}</button>
  </div>);
}

}

          </div>
        </div>}
        {tab==='info' && <div>
          <div style={{fontSize:13,fontWeight:700,color:B.white,marginBottom:10}}>LSI Color Guide</div>
          <div style={S.infoRow}><div style={infoDotStyle('#9b59b6')} /><div style={S.infoText}><div style={S.infoLabel}>Purple {'\u2014'} Scale Forming ({'\u2265'} +0.31)</div>Over-saturated with calcium carbonate. Scale will form on surfaces and equipment.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#5cb85c')} /><div style={S.infoText}><div style={S.infoLabel}>Green {'\u2014'} Ideal Balance (0.00 to +0.30)</div>Water is happy. Slightly positive LSI protects plaster. This is the target zone.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#f0ad4e')} /><div style={S.infoText}><div style={S.infoLabel}>Yellow {'\u2014'} Acceptable (-0.30 to -0.01)</div>Slightly under-saturated. pH will naturally rise toward green over time.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#d9534f')} /><div style={S.infoText}><div style={S.infoLabel}>Red {'\u2014'} Corrosive ({'\u2264'} -0.31)</div>Aggressive water. Will etch plaster, corrode metal, and damage equipment.</div></div>
          <div style={{marginTop:12,fontSize:11,color:B.grayDim,lineHeight:1.5}}>LSI = pH + TF + CF + AF - 12.1. Factors derived from PHTA lookup tables.</div>
        </div>}
        {tab==='volume' && <div>
          <div style={{fontSize:13,fontWeight:700,color:B.white,marginBottom:10}}>Pool Volume Estimator</div>
          <div style={{fontSize:11,color:B.grayMid,marginBottom:12}}>Select pool shape, then adjust values to estimate volume.</div>
          <div style={{display:'flex',gap:6,marginBottom:14}}>
            {[['circle','Circle'],['oblong','Oblong'],['rect','Rectangle']].map(function(arr){
              var k=arr[0],lbl=arr[1];
              return <button key={k} onClick={function(){setVolShape(k);}} style={{flex:1,padding:'8px 4px',borderRadius:8,border:'1px solid '+(volShape===k?B.teal:B.navyLight),background:volShape===k?B.teal:'transparent',color:volShape===k?B.white:B.grayMid,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:"'Jost',sans-serif"}}>{lbl}</button>;
            })}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {volShape==='circle' && <Fragment><VolField label="Radius (R)" value={volInputs.radius} onChange={function(v){updateVolInput('radius',v);}} /><VolField label="Avg Depth" value={volInputs.avgDepth} onChange={function(v){updateVolInput('avgDepth',v);}} step={0.5} /></Fragment>}
            {volShape==='oblong' && <Fragment><VolField label="Length (L)" value={volInputs.length} onChange={function(v){updateVolInput('length',v);}} /><VolField label="Large Diameter (A)" value={volInputs.diamA} onChange={function(v){updateVolInput('diamA',v);}} /><VolField label="Small Diameter (B)" value={volInputs.diamB} onChange={function(v){updateVolInput('diamB',v);}} /><VolField label="Deep Depth" value={volInputs.deepDepth} onChange={function(v){updateVolInput('deepDepth',v);}} step={0.5} /><VolField label="Shallow Depth" value={volInputs.shallowDepth} onChange={function(v){updateVolInput('shallowDepth',v);}} step={0.5} /></Fragment>}
            {volShape==='rect' && <Fragment><VolField label="Length (L)" value={volInputs.length} onChange={function(v){updateVolInput('length',v);}} /><VolField label="Width (W)" value={volInputs.width} onChange={function(v){updateVolInput('width',v);}} /><VolField label="Deep Depth" value={volInputs.deepDepth} onChange={function(v){updateVolInput('deepDepth',v);}} step={0.5} /><VolField label="Shallow Depth" value={volInputs.shallowDepth} onChange={function(v){updateVolInput('shallowDepth',v);}} step={0.5} /></Fragment>}
          </div>
          <div style={{textAlign:'center',margin:'18px 0 10px'}}><div style={{fontSize:28,fontWeight:800,color:B.teal}}>{Number(calcVol).toLocaleString()}</div><div style={{fontSize:13,color:B.grayMid}}>gallons</div></div>
          <button onClick={function(){setVolume(Math.round(calcVol));setTab('dosing');}} style={Object.assign({},S.calcBtn,{margin:'8px auto 4px',padding:'10px',fontSize:14})}>Use This Volume</button>
        </div>}
      </div>

      {/* FIELD REPORT SECTION */}
      <div style={S.sectionCard}>
        <div style={S.sectionTitle}>Field Report</div>
        <div style={S.fieldRow}>
          <div style={S.fieldLabel}>Chemicals Added</div>
        </div>
        <textarea style={Object.assign({},S.textArea,{marginBottom:10})} placeholder="List chemicals added and amounts..." value={chemsAdded} onChange={function(e){setChemsAdded(e.target.value);}} rows={3} />

        <div style={S.fieldRow}>
          <div style={S.fieldLabel}>Backwashed</div>
          <div style={S.togglePill}>
            <button style={pillBtnStyle(!backwashed)} onClick={function(){setBackwashed(false);}}>No</button>
            <button style={pillBtnStyle(backwashed)} onClick={function(){setBackwashed(true);}}>Yes</button>
          </div>
        </div>
        <div style={S.fieldRow}>
          <div style={S.fieldLabel}>Filter Type</div>
          <select style={S.fieldSelect} value={filterType} onChange={function(e){setFilterType(e.target.value);}}>
            <option value="">Select...</option>
            <option value="cartridge">Cartridge</option>
            <option value="sand">Sand</option>
            <option value="de">D.E.</option>
          </select>
        </div>
        <div style={S.fieldRow}>
          <div style={S.fieldLabel}>PSI</div>
          <input style={Object.assign({},S.fieldInput,{width:80,flex:'none'})} type="number" inputMode="decimal" placeholder="PSI" value={psiVal} onChange={function(e){setPsiVal(e.target.value);}} />
        </div>
        <div style={{marginTop:4}}>
          <div style={Object.assign({},S.fieldLabel,{marginBottom:4})}>Notes</div>
          <textarea style={S.textArea} placeholder="Additional notes..." value={notes} onChange={function(e){setNotes(e.target.value);}} rows={3} />
        </div>
      </div>

      {/* SAVE BUTTON */}
      {saveResult === 'success' ? (
        <div style={{textAlign:'center',margin:'12px auto 8px'}}>
          <div style={{color:B.flagGreen,fontSize:18,fontWeight:700}}>Saved to JN</div>
          <div style={{fontSize:12,color:B.grayMid,marginTop:4}}>Chemistry report created for {selectedJob ? selectedJob.name : ''}</div>
          {/* Share Report Button — appears after successful save */}
          <button onClick={function(){ setShowShare(true); }} style={Object.assign({},S.calcBtn,{margin:'12px auto 4px',background:'linear-gradient(90deg, #2ecc71 0%, #27ae60 100%)',width:'calc(100% - 48px)'})}>
            Share Report with Homeowner
          </button>
        </div>
      ) : (
        <button
          style={(!selectedJob || !techName || saving) ? S.disabledBtn : S.calcBtn}
          disabled={!selectedJob || !techName || saving}
          onClick={handleSave}
        >
          {saving ? 'Saving...' : !selectedJob ? 'Select a Job to Save' : !techName ? 'Select a Tech to Save' : 'Save to JN'}
        </button>
      )}
      {saveResult === 'error' && <div style={{textAlign:'center',fontSize:12,color:B.flagRed,marginBottom:8}}>Save failed — check connection and try again</div>}

      <div style={{textAlign:'center',padding:'8px 0 20px',fontSize:10,color:B.grayDim}}>SWP Chemistry App v0.5.1</div>
    </div>
  );
}

var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(SWPChemistryApp));
</script>
</body>
</html>
