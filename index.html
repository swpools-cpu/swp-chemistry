function getRanges(sanitizerType) {
  var base = {
    pH:   {min:7.2, max:7.8},
    ta:   {min:60,  max:120},
    ch:   {min:200, max:400},
    cya:  {min:30,  max:50},
    fc:   {min:1.0, max:4.0},
    phos: {min:0,   max:500},
  };
  if (sanitizerType === 'Salt') {
    base.tds = {min:2700, max:3400};
  } else {
    base.tds = {min:0, max:3000};
  }
  return base;
}

function jsonSafeString(str) {
  return str
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t');
}

function buildNoteBody(opts) {
  var now = new Date();
  var dateStr = (now.getMonth()+1)+'/'+now.getDate()+'/'+now.getFullYear()+' '+now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  var jobTypes = {nc:'New Construction',remodel:'Remodel',service:'Service',startup:'Startup'};
  var lines = [];
  lines.push('=== SWP Chemistry Report ===');
  lines.push('Date: '+dateStr);
  if (opts.techName) lines.push('Tech: '+opts.techName);
  if (opts.jobContext) lines.push('Job Type: '+(jobTypes[opts.jobContext]||opts.jobContext));
  if (opts.sanitizerType) lines.push('Sanitizer: '+opts.sanitizerType);
  lines.push('');
  lines.push('-- Current Readings --');
  var allParams = opts.params.concat(opts.extraParams);
  allParams.forEach(function(p){
    var val = opts.current[p.key];
    var d = p.decimals || 0;
    var display = d > 0 ? val.toFixed(d) : String(val);
    var flag = opts.getFlag(p.key, val);
    var flagStr = flag === 'ok' ? ' [OK]' : flag === 'high' ? ' [HIGH]' : flag === 'low' ? ' [LOW]' : '';
    var label = p.key === 'tds' ? (opts.sanitizerType === 'Salt' ? 'Salt Level' : 'TDS') : p.label;
    lines.push(label+': '+display+flagStr);
  });
  lines.push('');
  lines.push('Carb Alk: '+opts.carbAlk);
  lines.push('pH Ceiling: '+opts.phCeiling);
  lines.push('LSI: '+(opts.lsi >= 0 ? '+' : '')+opts.lsi.toFixed(2)+' ('+opts.lsiLabel+')');
  lines.push('');
  if (opts.dosing.length > 0) {
    lines.push('-- Dosing Recommendations --');
    opts.dosing.forEach(function(d){
      var amtStr = d.amount != null ? d.amount+' '+d.unit+' -- ' : '';
      lines.push('- '+d.chem+': '+amtStr+d.reason);
    });
    lines.push('');
  }
  lines.push('-- Field Report --');
  if (opts.chemsAdded) lines.push('Chemicals Added: '+opts.chemsAdded);
  lines.push('Backwashed: '+(opts.backwashed ? 'Yes' : 'No'));
  if (opts.filterType) lines.push('Filter Type: '+opts.filterType);
  if (opts.psiVal) lines.push('PSI: '+opts.psiVal);
  if (opts.notes) lines.push('Notes: '+opts.notes);
  lines.push('');
  lines.push('Pool Volume: '+opts.volume.toLocaleString()+' gal');
  return lines.join('\n');
}

function getFlag(key, value, ranges) {
  var range = ranges[key];
  if (!range) return null;
  if (key === 'tds' && value === 0) return null;
  if (value < range.min) return 'low';
  if (value > range.max) return 'high';
  return 'ok';
}

function flagColor(flag) {
  if (flag === 'ok') return B.flagGreen;
  if (flag === 'low' || flag === 'high') return B.flagRed;
  return 'transparent';
}

function interp(table, val) {
  var v = Math.max(table[0][0], Math.min(table[table.length-1][0], val));
  for (var i = 0; i < table.length - 1; i++) {
    if (v >= table[i][0] && v <= table[i+1][0]) {
      var t = (v - table[i][0]) / (table[i+1][0] - table[i][0]);
      return +(table[i][1] + t * (table[i+1][1] - table[i][1])).toFixed(3);
    }
  }
  return table[table.length-1][1];
}

var PARAMS = [
  { key:'temp', label:'Water \u00b0F', min:32, max:105, step:1, dflt:70, lsiParam:true },
  { key:'pH', label:'pH', min:6.0, max:8.6, step:0.1, dflt:7.5, lsiParam:true, decimals:1, showCeiling:true },
  { key:'ta', label:'Total Alkalinity', min:0, max:800, step:5, dflt:90, lsiParam:true, showCarbAlk:true, subLabel:'Carbonate Alkalinity' },
  { key:'ch', label:'Calcium', min:0, max:1000, step:10, dflt:350, lsiParam:true },

];

function calcLSI(vals) {
  var carbAlk = Math.max(vals.ta - Math.round(vals.cya / 3), 5);
  var TF = interp(TEMP_TABLE, vals.temp);
  var CF = interp(CH_TABLE, Math.max(vals.ch, 5));
  var AF = interp(TA_TABLE, Math.max(carbAlk, 5));
  var lsi = +(vals.pH + TF + CF + AF - 12.1).toFixed(2);
  return { lsi:lsi, TF:TF, CF:CF, AF:AF, carbAlk:carbAlk };
}

function calcDosing(current, desired, volume, sanitizerType) {
  var vf = volume / 10000;
  var carbAlk = Math.max(current.ta - Math.round(current.cya / 3), 5);
  var recs = [];
  if (current.pH > desired.pH + 0.05) {
    var pHDrop = current.pH - desired.pH;
    var acidDose = +(pHDrop * (5.317 + 0.2495 * carbAlk) * vf).toFixed(2);
    recs.push({ chem:'Muriatic Acid (31.45%)', amount:acidDose, unit:'fl oz', reason:'Lower pH ' + current.pH.toFixed(1) + ' \u2192 ' + desired.pH.toFixed(1) });
  }
  if (current.pH < desired.pH - 0.05) {
    recs.push({ chem:'Soda Ash (Na\u2082CO\u2083)', amount:+(((desired.pH - current.pH)/0.1)*0.502*vf).toFixed(2), unit:'lbs', reason:'Raise pH ' + current.pH.toFixed(1) + ' \u2192 ' + desired.pH.toFixed(1) });
  }
  if (current.ta < desired.ta - 5) {
    recs.push({ chem:'Sodium Bicarbonate', amount:+(((desired.ta - current.ta)/10)*1.4*vf).toFixed(2), unit:'lbs', reason:'Raise TA ' + current.ta + ' \u2192 ' + desired.ta + ' ppm' });
  }
  if (current.ta > desired.ta + 20) {
    recs.push({ chem:'Muriatic Acid + Aerate', amount:null, unit:'', reason:'TA ' + current.ta + ' is high \u2014 add acid & aerate to degas CO\u2082' });
  }
  if (current.ch < desired.ch - 25) {
    recs.push({ chem:'Calcium Chloride (94%)', amount:+(((desired.ch - current.ch)/10)*1.004*vf).toFixed(2), unit:'lbs', reason:'Raise CH ' + current.ch + ' \u2192 ' + desired.ch + ' ppm' });
  }
  if (current.cya < desired.cya - 5) {
    recs.push({ chem:'CYA / Stabilizer', amount:+(((desired.cya - current.cya)/10)*0.833*vf).toFixed(2), unit:'lbs', reason:'Raise CYA ' + current.cya + ' \u2192 ' + desired.cya + ' ppm' });
  }
  if (current.fc < desired.fc - 0.5) {
    recs.push({ chem:'Cal-Hypo (65-68%)', amount:+((desired.fc - current.fc)*2.07*vf).toFixed(2), unit:'oz', reason:'Raise FC ' + current.fc.toFixed(1) + ' \u2192 ' + desired.fc.toFixed(1) + ' ppm' });
  }
  // Salt dosing — only for salt pools
  if (sanitizerType === 'Salt' && current.tds < desired.tds - 200) {
    recs.push({ chem:'Pool Salt (NaCl)', amount:+(((desired.tds - current.tds)/100)*8.345*vf).toFixed(1), unit:'lbs', reason:'Raise salt ' + current.tds + ' \u2192 ' + desired.tds + ' ppm' });
  }
  return recs;
}

function lsiMeta(lsi) {
  if (lsi <= -0.31) return { label:'CORROSIVE', color:'#d9534f', bg:'#d9534f' };
  if (lsi <= -0.01) return { label:'ACCEPTABLE', color:'#f0ad4e', bg:'#f0ad4e' };
  if (lsi <= 0.30) return { label:'BALANCED', color:'#5cb85c', bg:'#5cb85c' };
  return { label:'SCALE FORMING', color:'#9b59b6', bg:'#9b59b6' };
}

function phCeiling(ta, cya) {
  var carbAlk = Math.max(ta - Math.round(cya / 3), 5);
  return +(Math.min(8.4, 7.5 + (carbAlk - 80) * 0.005)).toFixed(2);
}

function tdsLabel(sanitizerType) {
  return sanitizerType === 'Salt' ? 'Salt Level' : 'TDS';

  var updateCurrent = useCallback(function(key,val){setCurrent(function(prev){var n=Object.assign({},prev);n[key]=val;return n;});}, []);
  var updateDesired = useCallback(function(key,val){setDesired(function(prev){var n=Object.assign({},prev);n[key]=val;return n;});}, []);
  var updateVolInput = useCallback(function(key,val){setVolInputs(function(prev){var n=Object.assign({},prev);n[key]=val;return n;});}, []);

  // When sanitizer type changes to Salt, set default desired TDS if it's 0
  useEffect(function(){
    if (sanitizerType === 'Salt' && desired.tds === 0) {
      updateDesired('tds', 3200);
    }
  }, [sanitizerType]);

  var currentLSI = useMemo(function(){return calcLSI(current);}, [current]);
  var desiredLSI = useMemo(function(){return calcLSI(desired);}, [desired]);
  var currentMeta = lsiMeta(currentLSI.lsi);
  var desiredMeta = lsiMeta(desiredLSI.lsi);
  var currentCeiling = phCeiling(current.ta, current.cya);

  var dosing = useMemo(function(){return calcDosing(current,desired,volume,sanitizerType);}, [current,desired,volume,sanitizerType]);
  var startupRecs = useMemo(function(){var vf=volume/10000;return [
    {name:'SC-1000 \u2014 Initial Dose',dose:(vf*16).toFixed(0)+' oz',note:'Day 1, before or during fill'},
    {name:'SC-1000 \u2014 Weekly Maintenance',dose:(vf*4).toFixed(0)+' oz/wk',note:'Weeks 2\u20134 post startup'},
    {name:'CE-Clarifier / Enzyme',dose:(vf*8).toFixed(0)+' oz',note:'Weekly \u2014 phosphates & organics'},
  ];}, [volume]);

  var calcVol = useMemo(function(){
    var v = volInputs, GAL = 7.48;
    if (volShape==='circle') return +(Math.PI*v.radius*v.radius*v.avgDepth*GAL).toFixed(1);
    if (volShape==='oblong') { var avgD=(v.deepDepth+v.shallowDepth)/2; return +(v.length*((v.diamA+v.diamB)/2)*avgD*GAL*0.9).toFixed(0); }
    var avgD2=(v.deepDepth+v.shallowDepth)/2;
    return +(v.length*v.width*avgD2*GAL).toFixed(0);
  }, [volShape, volInputs]);

  var jobResults = useMemo(function(){
    if (jobSearch.length < 2) return [];
    var q = jobSearch.toLowerCase();
    return jobs.filter(function(j){ return j.name.toLowerCase().indexOf(q) >= 0; });
  }, [jobSearch, jobs]);

  function loadJobs() {
    setJobsLoading(true);
    setJobsError(null);
    fetch(WEBHOOK_JOB_LIST)
      .then(function(r){ return r.json(); })
      .then(function(data){
        var results = data.results || data || [];
        var mapped = results.map(function(j){
          var addr = [j.address_line1, j.city, j.state_text].filter(Boolean).join(', ');
          return {
            name: j.name || j.display_name || '',
            address: addr,
            jnid: j.jnid || '',
            poolGallons: parseInt(j['Pool Gallons']) || 0,
            sanitizerType: j['Sanitizer Type'] || '',
            recordTypeName: j.record_type_name || '',
          };
        }).filter(function(j){ return j.name && j.jnid; });
        setJobs(mapped);
        setJobsLoading(false);
      })
      .catch(function(err){
        setJobsError('Failed to load jobs');
        setJobsLoading(false);
      });
  }
  useEffect(function(){ loadJobs(); }, []);

  // Handle job selection — auto-populate sanitizer type and volume
  function handleJobSelect(job) {
    setSelectedJob(job);
    setShowDropdown(false);
    setJobSearch('');
    setSaveResult(null);
    if (job.poolGallons > 0) { setVolume(job.poolGallons); }
    if (job.sanitizerType) {
      setSanitizerType(job.sanitizerType);
      setSanitizerSource('jn');
    } else {
      setSanitizerType('');
      setSanitizerSource('');
    }
  }

  function handleJobClear() {
    setSelectedJob(null);
    setJobSearch('');
    setSaveResult(null);
    setSanitizerType('');
    setSanitizerSource('');
  }

  // Save to JN handler
  function handleSave() {
    if (!selectedJob || !techName) return;
    setSaving(true);
    setSaveResult(null);
    var noteBody = buildNoteBody({
      techName: techName,
      jobContext: jobContext,
      sanitizerType: sanitizerType,
      current: current,
      params: PARAMS,
      extraParams: EXTRA_PARAMS,
      getFlag: function(key, val) { return getFlag(key, val, ranges); },
      carbAlk: currentLSI.carbAlk,
      phCeiling: currentCeiling,
      lsi: currentLSI.lsi,
      lsiLabel: currentMeta.label,
      dosing: dosing,
      chemsAdded: chemsAdded,
      backwashed: backwashed,
      filterType: filterType,
      psiVal: psiVal,
      notes: notes,
      volume: volume
    });
    var payload = {
      jnid: selectedJob.jnid,
      note: jsonSafeString(noteBody),
      poolVolume: volume,
      updatePoolGallons: selectedJob.poolGallons > 0 ? 'no' : 'yes',
      sanitizerType: sanitizerType,
      updateSanitizerType: sanitizerSource === 'manual' ? 'yes' : 'no'
    };
    fetch(WEBHOOK_SAVE, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    })
    .then(function(r){
      if (r.ok) { setSaveResult('success'); }
      else { setSaveResult('error'); }
      setSaving(false);
    })
    .catch(function(){
      setSaveResult('error');
      setSaving(false);
    });
  }

  function handleVolumeChange(e) {
    setVolumeStr(e.target.value);
  }
  function handleVolumeBlur() {
    var v = parseInt(volumeStr);
    if (!isNaN(v) && v > 0) { setVolume(v); setVolumeStr(String(v)); }
    else { setVolumeStr(String(volume)); }
  }
  useEffect(function(){ setVolumeStr(String(volume)); }, [volume]);

  useEffect(function(){ try { localStorage.setItem('swp_tech_select', techSelect); } catch(e) {} }, [techSelect]);
  useEffect(function(){ try { localStorage.setItem('swp_tech_custom', techCustom); } catch(e) {} }, [techCustom]);

  // Dynamic TDS label
  var currentTdsLabel = tdsLabel(sanitizerType);

  // Get param label with sanitizer-aware TDS
  function getParamLabel(p) {
    if (p.key === 'tds') return currentTdsLabel;
    return p.label;
  }

  // Share report uses generateShareHTML()


  // Generate standalone HTML for share report (opens in new tab for screenshot/PDF)
  function openShareReport() {
    var now = new Date();
    var dateStr = (now.getMonth()+1)+'/'+now.getDate()+'/'+now.getFullYear();
    var allParams = PARAMS.concat(EXTRA_PARAMS);
    var meta = lsiMeta(currentLSI.lsi);
    
    var readingsRows = allParams.map(function(p){
      var val = current[p.key];
      var d = p.decimals || 0;
      var display = d > 0 ? val.toFixed(d) : String(val);
      var flag = getFlag(p.key, val, ranges);
      var label = p.key === 'tds' ? tdsLabel(sanitizerType) : p.label;
      var flagHtml = '';
      if (flag === 'ok') flagHtml = '<span style="color:#27ae60;font-weight:700">\u2713 OK</span>';
      else if (flag === 'low') flagHtml = '<span style="color:#e74c3c;font-weight:700">\u25bc LOW</span>';
      else if (flag === 'high') flagHtml = '<span style="color:#e74c3c;font-weight:700">\u25b2 HIGH</span>';
      else flagHtml = '<span style="color:#999">\u2014</span>';
      return '<tr><td style="padding:6px 8px;border-bottom:1px solid #eee">'+label+'</td><td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:center;font-weight:700">'+display+'</td><td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:center">'+flagHtml+'</td></tr>';
    }).join('');

    var dosingHtml = '';
    if (dosing.length > 0) {
      dosingHtml = '<div style="margin-bottom:16px"><div style="font-size:14px;font-weight:700;color:#03417f;border-bottom:2px solid #238baa;padding-bottom:4px;margin-bottom:10px">Dosing Recommendations</div>';
      dosing.forEach(function(d){
        dosingHtml += '<div style="padding:8px 10px;background:#f0f4f8;border-radius:6px;margin-bottom:6px">';
        dosingHtml += '<div style="font-size:13px;font-weight:700;color:#03417f">'+d.chem+'</div>';
        if (d.amount != null) dosingHtml += '<div style="font-size:16px;font-weight:800;color:#222">'+d.amount+' '+d.unit+'</div>';
        dosingHtml += '<div style="font-size:11px;color:#666">'+d.reason+'</div></div>';
      });
      dosingHtml += '</div>';
    }

    var notesHtml = '';
    if (chemsAdded || notes || filterType || psiVal) {
      notesHtml = '<div style="margin-bottom:16px"><div style="font-size:14px;font-weight:700;color:#03417f;border-bottom:2px solid #238baa;padding-bottom:4px;margin-bottom:10px">Service Notes</div>';
      if (chemsAdded) notesHtml += '<div style="margin-bottom:6px"><span style="font-weight:700;color:#03417f">Chemicals Added:</span> '+chemsAdded+'</div>';
      if (backwashed) notesHtml += '<div style="margin-bottom:6px"><span style="font-weight:700;color:#03417f">Backwashed:</span> Yes</div>';
      if (filterType) notesHtml += '<div style="margin-bottom:6px"><span style="font-weight:700;color:#03417f">Filter Type:</span> '+filterType+'</div>';
      if (psiVal) notesHtml += '<div style="margin-bottom:6px"><span style="font-weight:700;color:#03417f">PSI:</span> '+psiVal+'</div>';
      if (notes) notesHtml += '<div style="margin-bottom:6px"><span style="font-weight:700;color:#03417f">Notes:</span> '+notes+'</div>';
      notesHtml += '</div>';
    }

    var sanitizerBadge = '';
    if (sanitizerType) {
      var badgeColor = sanitizerType === 'Salt' ? '#3498db' : '#2ecc71';
      sanitizerBadge = '<div style="text-align:center;margin-bottom:16px"><span style="display:inline-block;padding:4px 14px;border-radius:16px;font-size:13px;font-weight:700;background:'+badgeColor+';color:#fff">'+sanitizerType+' Pool</span></div>';
    }

    var jobHtml = '';
    if (selectedJob) {
      jobHtml = '<div style="font-size:16px;font-weight:700;color:#fff;margin-top:6px">'+selectedJob.name+'</div>';
      if (selectedJob.address) jobHtml += '<div style="font-size:12px;color:rgba(255,255,255,0.7)">'+selectedJob.address+'</div>';
    }

    var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Water Chemistry Report</title>'
      + '<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">'
      + '<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Jost",sans-serif;background:#fff;color:#222;padding:16px;max-width:440px;margin:0 auto}'
      + ' @media print{body{padding:0}}</style></head><body>'
      + '<div style="background:linear-gradient(135deg,#03417f 0%,#238baa 100%);padding:20px;border-radius:12px;text-align:center;margin-bottom:20px">'
      + '<img src="'+LOGO_SRC+'" style="height:40px;margin-bottom:8px" />'
      + '<div style="font-size:18px;font-weight:800;color:#fff">Water Chemistry Report</div>'
      + '<div style="font-size:12px;color:rgba(255,255,255,0.8);margin-top:4px">'+dateStr+'</div>'
      + jobHtml
      + '</div>'
      + sanitizerBadge
      + '<div style="text-align:center;margin-bottom:20px">'
      + '<div style="font-size:12px;color:#666;margin-bottom:4px">Langelier Saturation Index</div>'
      + '<span style="display:inline-block;padding:4px 14px;border-radius:16px;font-weight:800;font-size:14px;color:#fff;background:'+meta.bg+'">'+(currentLSI.lsi>=0?'+':'')+currentLSI.lsi.toFixed(2)+' \u2014 '+meta.label+'</span>'
      + '<div style="font-size:11px;color:#999;margin-top:6px">Carb Alk: '+currentLSI.carbAlk+' | pH Ceiling: '+currentCeiling+'</div>'
      + '</div>'
      + '<div style="margin-bottom:16px"><div style="font-size:14px;font-weight:700;color:#03417f;border-bottom:2px solid #238baa;padding-bottom:4px;margin-bottom:10px">Current Readings</div>'
      + '<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>'
      + '<th style="text-align:left;padding:6px 8px;background:#f0f4f8;font-weight:700;color:#03417f;border-bottom:1px solid #ddd">Parameter</th>'
      + '<th style="text-align:center;padding:6px 8px;background:#f0f4f8;font-weight:700;color:#03417f;border-bottom:1px solid #ddd">Value</th>'
      + '<th style="text-align:center;padding:6px 8px;background:#f0f4f8;font-weight:700;color:#03417f;border-bottom:1px solid #ddd">Status</th>'
      + '</tr></thead><tbody>'+readingsRows+'</tbody></table></div>'
      + dosingHtml
      + notesHtml
      + '<div style="text-align:center;font-size:12px;color:#999;margin-bottom:8px">Pool Volume: '+volume.toLocaleString()+' gallons</div>'
      + '<div style="text-align:center;padding:16px 0;font-size:11px;color:#999;border-top:1px solid #eee;margin-top:20px">'
      + 'Southwest Pools LLC | swpoolsdfw.com<br>2081 Hutton Drive Suite 101, Carrollton TX 75006 | 469-328-0155</div>'
      + '</body></html>';

    var w = window.open('', '_blank');
    if (w) { w.document.write(html); w.document.close(); }
    else { alert('Please allow popups to view the report.'); }
  }

  return (
    <div style={S.app}>
      <div style={S.header}><img src={LOGO_SRC} alt="Southwest Pools" style={S.logo} /></div>

      {/* JOB LOOKUP + TECH INFO */}
      <div style={S.sectionCard}>
        <div style={S.sectionTitle}>Job Info</div>
        {selectedJob ? (
          <div>
            <div style={S.jobConfirmed}>
              <div style={S.jobConfirmedName}>{selectedJob.name}</div>
              <div style={S.jobConfirmedAddr}>{selectedJob.address}</div>
              {/* Sanitizer Type Badge */}
              {sanitizerType ? (
                <div style={sanitizerBadgeStyle(sanitizerType)}>
                  {sanitizerType === 'Salt' ? '\u2699\ufe0f' : '\ud83e\uddea'} {sanitizerType} Pool

                    <button onClick={function(){setSanitizerType('Chlorine');setSanitizerSource('manual');}} style={{padding:'4px 12px',borderRadius:12,border:'1px solid '+B.chlorineGreen,background:'transparent',color:B.chlorineGreen,fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:"'Jost',sans-serif"}}>Set Chlorine</button>
                    <button onClick={function(){setSanitizerType('Salt');setSanitizerSource('manual');}} style={{padding:'4px 12px',borderRadius:12,border:'1px solid '+B.saltBlue,background:'transparent',color:B.saltBlue,fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:"'Jost',sans-serif"}}>Set Salt</button>

        <div style={Object.assign({},S.fieldRow,{marginTop:8})}>

        {tab==='dosing' && <div>
          {dosing.length===0 && <div style={Object.assign({},S.doseItem,{textAlign:'center'})}><div style={Object.assign({},S.doseChem,{color:'#5cb85c'})}>Water is balanced</div></div>}
          {dosing.map(function(d,i){return <div key={i} style={S.doseItem}><div style={S.doseChem}>{d.chem}</div>{d.amount!=null && <div style={S.doseAmt}>{d.amount} {d.unit}</div>}<div style={S.doseReason}>{d.reason}</div></div>;})}
        </div>}
        {tab==='startup' && <div>
          <div style={{fontSize:12,color:B.grayMid,marginBottom:10}}>Orenda product doses scaled to {volume.toLocaleString()} gal</div>
          {/* Salt startup warning in startup tab */}
          {sanitizerType === 'Salt' && (
            <div style={Object.assign({},S.startupItem,{border:'1px solid '+B.saltBlue,background:B.saltBlue+'15'})}>
              <div style={Object.assign({},S.startupName,{color:B.saltBlue})}>{'\u26a0\ufe0f'} Salt Pool Startup</div>
              <div style={{fontSize:12,color:B.gray,marginTop:4}}>Do NOT add salt until 30 days post-plaster. Keep the salt cell OFF during the entire startup period. Balance all other chemistry parameters first, then add salt gradually after the 30-day mark.</div>
            </div>
          )}
          {startupRecs.map(function(r,i){return <div key={i} style={S.startupItem}><div style={S.startupName}>{r.name}</div><div style={S.startupDose}>{r.dose}</div><div style={S.startupNote}>{r.note}</div></div>;})}
          <div style={Object.assign({},S.startupItem,{border:'1px solid '+B.tealDim,background:'transparent'})}>
            <div style={Object.assign({},S.startupName,{color:'#f0ad4e'})}>DFW Note {'\u2014'} Phosphates</div>
            <div style={{fontSize:12,color:B.gray,marginTop:4}}>North Texas tap water often contains 300{'\u2013'}600+ ppb phosphates. Test and treat with CV-600/700 or PR-10,000 as needed during fill.</div>
          </div>
        </div>}
        {tab==='factors' && <div>
          <div style={{fontSize:12,color:B.grayMid,marginBottom:8}}>LSI = pH + TF + CF + AF - 12.1</div>
          <div style={{display:'flex',gap:12}}>
            <div style={{flex:1}}>
              <div style={Object.assign({},S.colHeader,{marginBottom:8})}>Current</div>
              <div style={S.factorRow}><span>pH</span><span style={S.factorVal}>{current.pH.toFixed(1)}</span></div>
              <div style={S.factorRow}><span>Temp Factor</span><span style={S.factorVal}>{currentLSI.TF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Calcium Factor</span><span style={S.factorVal}>{currentLSI.CF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Alk Factor</span><span style={S.factorVal}>{currentLSI.AF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Carb Alk</span><span style={S.factorVal}>{currentLSI.carbAlk}</span></div>
              <div style={Object.assign({},S.factorRow,{borderTop:'1px solid '+B.navyLight,paddingTop:6,marginTop:4})}><span style={{fontWeight:700}}>LSI</span><span style={{fontWeight:800,color:currentMeta.color}}>{currentLSI.lsi.toFixed(2)}</span></div>
            </div>
            <div style={{width:1,background:B.navyLight}} />
            <div style={{flex:1}}>
              <div style={Object.assign({},S.colHeader,{marginBottom:8})}>Desired</div>
              <div style={S.factorRow}><span>pH</span><span style={S.factorVal}>{desired.pH.toFixed(1)}</span></div>
              <div style={S.factorRow}><span>Temp Factor</span><span style={S.factorVal}>{desiredLSI.TF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Calcium Factor</span><span style={S.factorVal}>{desiredLSI.CF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Alk Factor</span><span style={S.factorVal}>{desiredLSI.AF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Carb Alk</span><span style={S.factorVal}>{desiredLSI.carbAlk}</span></div>
              <div style={Object.assign({},S.factorRow,{borderTop:'1px solid '+B.navyLight,paddingTop:6,marginTop:4})}><span style={{fontWeight:700}}>LSI</span><span style={{fontWeight:800,color:desiredMeta.color}}>{desiredLSI.lsi.toFixed(2)}</span></div>
            </div>
          </div>
        </div>}
        {tab==='info' && <div>
          <div style={{fontSize:13,fontWeight:700,color:B.white,marginBottom:10}}>LSI Color Guide</div>
          <div style={S.infoRow}><div style={infoDotStyle('#9b59b6')} /><div style={S.infoText}><div style={S.infoLabel}>Purple {'\u2014'} Scale Forming ({'\u2265'} +0.31)</div>Over-saturated with calcium carbonate. Scale will form on surfaces and equipment.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#5cb85c')} /><div style={S.infoText}><div style={S.infoLabel}>Green {'\u2014'} Ideal Balance (0.00 to +0.30)</div>Water is happy. Slightly positive LSI protects plaster. This is the target zone.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#f0ad4e')} /><div style={S.infoText}><div style={S.infoLabel}>Yellow {'\u2014'} Acceptable (-0.30 to -0.01)</div>Slightly under-saturated. pH will naturally rise toward green over time.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#d9534f')} /><div style={S.infoText}><div style={S.infoLabel}>Red {'\u2014'} Corrosive ({'\u2264'} -0.31)</div>Aggressive water. Will etch plaster, corrode metal, and damage equipment.</div></div>
          <div style={{marginTop:12,fontSize:11,color:B.grayDim,lineHeight:1.5}}>LSI = pH + TF + CF + AF - 12.1. Factors derived from PHTA lookup tables.</div>
        </div>}
        {tab==='volume' && <div>
          <div style={{fontSize:13,fontWeight:700,color:B.white,marginBottom:10}}>Pool Volume Estimator</div>
          <div style={{fontSize:11,color:B.grayMid,marginBottom:12}}>Select pool shape, then adjust values to estimate volume.</div>
          <div style={{display:'flex',gap:6,marginBottom:14}}>
            {[['circle','Circle'],['oblong','Oblong'],['rect','Rectangle']].map(function(arr){
              var k=arr[0],lbl=arr[1];
              return <button key={k} onClick={function(){setVolShape(k);}} style={{flex:1,padding:'8px 4px',borderRadius:8,border:'1px solid '+(volShape===k?B.teal:B.navyLight),background:volShape===k?B.teal:'transparent',color:volShape===k?B.white:B.grayMid,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:"'Jost',sans-serif"}}>{lbl}</button>;
            })}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {volShape==='circle' && <Fragment><VolField label="Radius (R)" value={volInputs.radius} onChange={function(v){updateVolInput('radius',v);}} /><VolField label="Avg Depth" value={volInputs.avgDepth} onChange={function(v){updateVolInput('avgDepth',v);}} step={0.5} /></Fragment>}
            {volShape==='oblong' && <Fragment><VolField label="Length (L)" value={volInputs.length} onChange={function(v){updateVolInput('length',v);}} /><VolField label="Large Diameter (A)" value={volInputs.diamA} onChange={function(v){updateVolInput('diamA',v);}} /><VolField label="Small Diameter (B)" value={volInputs.diamB} onChange={function(v){updateVolInput('diamB',v);}} /><VolField label="Deep Depth" value={volInputs.deepDepth} onChange={function(v){updateVolInput('deepDepth',v);}} step={0.5} /><VolField label="Shallow Depth" value={volInputs.shallowDepth} onChange={function(v){updateVolInput('shallowDepth',v);}} step={0.5} /></Fragment>}
            {volShape==='rect' && <Fragment><VolField label="Length (L)" value={volInputs.length} onChange={function(v){updateVolInput('length',v);}} /><VolField label="Width (W)" value={volInputs.width} onChange={function(v){updateVolInput('width',v);}} /><VolField label="Deep Depth" value={volInputs.deepDepth} onChange={function(v){updateVolInput('deepDepth',v);}} step={0.5} /><VolField label="Shallow Depth" value={volInputs.shallowDepth} onChange={function(v){updateVolInput('shallowDepth',v);}} step={0.5} /></Fragment>}
          </div>
          <div style={{textAlign:'center',margin:'18px 0 10px'}}><div style={{fontSize:28,fontWeight:800,color:B.teal}}>{Number(calcVol).toLocaleString()}</div><div style={{fontSize:13,color:B.grayMid}}>gallons</div></div>
          <button onClick={function(){setVolume(Math.round(calcVol));setTab('dosing');}} style={Object.assign({},S.calcBtn,{margin:'8px auto 4px',padding:'10px',fontSize:14})}>Use This Volume</button>
        </div>}
      </div>

      {/* FIELD REPORT SECTION */}
      <div style={S.sectionCard}>
        <div style={S.sectionTitle}>Field Report</div>
        <div style={S.fieldRow}>
          <div style={S.fieldLabel}>Chemicals Added</div>
        </div>
        <textarea style={Object.assign({},S.textArea,{marginBottom:10})} placeholder="List chemicals added and amounts..." value={chemsAdded} onChange={function(e){setChemsAdded(e.target.value);}} rows={3} />

        <div style={S.fieldRow}>
          <div style={S.fieldLabel}>Backwashed</div>
          <div style={S.togglePill}>
            <button style={pillBtnStyle(!backwashed)} onClick={function(){setBackwashed(false);}}>No</button>
            <button style={pillBtnStyle(backwashed)} onClick={function(){setBackwashed(true);}}>Yes</button>
          </div>
        </div>
        <div style={S.fieldRow}>
          <div style={S.fieldLabel}>Filter Type</div>
          <select style={S.fieldSelect} value={filterType} onChange={function(e){setFilterType(e.target.value);}}>
            <option value="">Select...</option>
            <option value="cartridge">Cartridge</option>
            <option value="sand">Sand</option>
            <option value="de">D.E.</option>
          </select>
        </div>
        <div style={S.fieldRow}>
          <div style={S.fieldLabel}>PSI</div>
          <input style={Object.assign({},S.fieldInput,{width:80,flex:'none'})} type="number" inputMode="decimal" placeholder="PSI" value={psiVal} onChange={function(e){setPsiVal(e.target.value);}} />
        </div>
        <div style={{marginTop:4}}>
          <div style={Object.assign({},S.fieldLabel,{marginBottom:4})}>Notes</div>
          <textarea style={S.textArea} placeholder="Additional notes..." value={notes} onChange={function(e){setNotes(e.target.value);}} rows={3} />
        </div>
      </div>

      {/* SAVE BUTTON */}
      {saveResult === 'success' ? (
        <div style={{textAlign:'center',margin:'12px auto 8px'}}>
          <div style={{color:B.flagGreen,fontSize:18,fontWeight:700}}>Saved to JN</div>
          <div style={{fontSize:12,color:B.grayMid,marginTop:4}}>Chemistry report created for {selectedJob ? selectedJob.name : ''}</div>
          {/* Share Report Button — appears after successful save */}
          <button onClick={function(){ openShareReport(); }} style={Object.assign({},S.calcBtn,{margin:'12px auto 4px',background:'linear-gradient(90deg, #2ecc71 0%, #27ae60 100%)',width:'calc(100% - 48px)'})}>
            Share Report with Homeowner
          </button>
        </div>
      ) : (
        <button
          style={(!selectedJob || !techName || saving) ? S.disabledBtn : S.calcBtn}
          disabled={!selectedJob || !techName || saving}
          onClick={handleSave}
        >
          {saving ? 'Saving...' : !selectedJob ? 'Select a Job to Save' : !techName ? 'Select a Tech to Save' : 'Save to JN'}
        </button>
      )}
      {saveResult === 'error' && <div style={{textAlign:'center',fontSize:12,color:B.flagRed,marginBottom:8}}>Save failed — check connection and try again</div>}

      <div style={{textAlign:'center',padding:'8px 0 20px',fontSize:10,color:B.grayDim}}>SWP Chemistry App v0.5.1</div>
    </div>
  );
}

var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(SWPChemistryApp));
</script>
</body>
</html>
