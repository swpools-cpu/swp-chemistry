// ─── LSI LOOKUP TABLES (PHTA Standard) ─────────────────────────────────────
const TEMP_TABLE = [[32,0.0],[37,0.1],[46,0.2],[53,0.3],[60,0.4],[66,0.5],[76,0.6],[84,0.7],[94,0.8],[105,0.9]];
const CH_TABLE   = [[5,0.3],[25,1.0],[50,1.3],[75,1.5],[100,1.6],[150,1.8],[200,1.9],[250,2.0],[300,2.1],[400,2.2],[800,2.5],[1000,2.6]];
const TA_TABLE   = [[5,0.7],[25,1.4],[50,1.7],[75,1.9],[100,2.0],[150,2.2],[200,2.3],[250,2.4],[300,2.5],[400,2.6],[800,2.9],[1000,3.0]];

function interp(table, val) {
  const v = Math.max(table[0][0], Math.min(table[table.length-1][0], val));
  for (let i = 0; i < table.length - 1; i++) {
    if (v >= table[i][0] && v <= table[i+1][0]) {
      const t = (v - table[i][0]) / (table[i+1][0] - table[i][0]);
      return +(table[i][1] + t * (table[i+1][1] - table[i][1])).toFixed(3);
    }
  }
  return table[table.length-1][1];
}

// ─── PARAMETER CONFIG ──────────────────────────────────────────────────────
const PARAMS = [
  { key: 'temp',  label: 'Water °F',          min: 32,  max: 105, step: 1,   default: 70,   lsiParam: true },
  { key: 'pH',    label: 'pH',                 min: 6.0, max: 8.6, step: 0.1, default: 7.5,  lsiParam: true, decimals: 1, showCeiling: true },
  { key: 'ta',    label: 'Total Alkalinity',   min: 0,   max: 800, step: 5,   default: 90,   lsiParam: true, showCarbAlk: true, subLabel: 'Carbonate Alkalinity' },
  { key: 'ch',    label: 'Calcium',            min: 0,   max: 1000,step: 10,  default: 350,  lsiParam: true },
  { key: 'cya',   label: 'CYA',               min: 0,   max: 300, step: 5,   default: 40,   lsiParam: true },
  { key: 'tds',   label: 'TDS/Salt',          min: 0,   max: 8000,step: 100, default: 0,    lsiParam: true },
];

const EXTRA_PARAMS = [
  { key: 'fc',    label: 'Chlorine',           min: 0,   max: 20,  step: 0.25,default: 3.5,  decimals: 2 },
  { key: 'phos',  label: 'Phosphate',          min: 0,   max: 5000,step: 100, default: 0 },
];

// ─── LSI CALCULATION ───────────────────────────────────────────────────────
function calcLSI(vals) {
  const carbAlk = Math.max(vals.ta - Math.round(vals.cya / 3), 5);
  const TF = interp(TEMP_TABLE, vals.temp);
  const CF = interp(CH_TABLE, Math.max(vals.ch, 5));
  const AF = interp(TA_TABLE, Math.max(carbAlk, 5));
  const lsi = +(vals.pH + TF + CF + AF - 12.1).toFixed(2);
  return { lsi, TF, CF, AF, carbAlk };
}

// ─── DOSING — Calibrated against Orenda app (March 2026) ───────────────────
// Muriatic acid uses TA-dependent formula (alkalinity buffers pH change)
// All other multipliers derived from single-point Orenda calibration at 10k gal
function calcDosing(current, desired, volume) {
  const vf = volume / 10000;
  const carbAlk = Math.max(current.ta - Math.round(current.cya / 3), 5);
  const recs = [];
  // Muriatic Acid — TA-dependent: dose = pH_drop × (5.317 + 0.2495 × carbAlk) × vf
  // Calibrated: pH 8.0→7.5, 10k, TA=60/CYA=20 → 9.27 fl oz; TA=100/CYA=20 → 14.26 fl oz
  if (current.pH > desired.pH + 0.05) {
    const pHDrop = current.pH - desired.pH;
    const acidDose = +(pHDrop * (5.317 + 0.2495 * carbAlk) * vf).toFixed(2);
    recs.push({ chem:'Muriatic Acid (31.45%)', amount:acidDose, unit:'fl oz', reason:`Lower pH ${current.pH.toFixed(1)} → ${desired.pH.toFixed(1)}` });
  }
  // Soda Ash — 0.502 lbs per 0.1 pH per 10k gal (calibrated: 2.51 lbs for pH 7.0→7.5 at 10k)
  if (current.pH < desired.pH - 0.05) {
    recs.push({ chem:'Soda Ash (Na₂CO₃)', amount:+(((desired.pH - current.pH)/0.1)*0.502*vf).toFixed(2), unit:'lbs', reason:`Raise pH ${current.pH.toFixed(1)} → ${desired.pH.toFixed(1)}` });
  }
  // Sodium Bicarbonate — 1.4 lbs per 10 ppm per 10k gal (calibrated: 2.80 lbs for TA 60→80 at 10k)
  if (current.ta < desired.ta - 5) {
    recs.push({ chem:'Sodium Bicarbonate', amount:+(((desired.ta - current.ta)/10)*1.4*vf).toFixed(2), unit:'lbs', reason:`Raise TA ${current.ta} → ${desired.ta} ppm` });
  }
  // TA too high — no simple chemical dose, acid + aeration
  if (current.ta > desired.ta + 20) {
    recs.push({ chem:'Muriatic Acid + Aerate', amount:null, unit:'', reason:`TA ${current.ta} is high — add acid & aerate to degas CO₂` });
  }
  // Calcium Chloride 77% — 1.226 lbs per 10 ppm per 10k gal (calibrated: 18.39 lbs for CH 200→350 at 10k)
  if (current.ch < desired.ch - 25) {
    recs.push({ chem:'Calcium Chloride (77%)', amount:+(((desired.ch - current.ch)/10)*1.226*vf).toFixed(2), unit:'lbs', reason:`Raise CH ${current.ch} → ${desired.ch} ppm` });
  }
  // CYA — 0.833 lbs per 10 ppm per 10k gal (calibrated: 2.50 lbs for CYA 20→50 at 10k)
  if (current.cya < desired.cya - 5) {
    recs.push({ chem:'CYA / Stabilizer', amount:+(((desired.cya - current.cya)/10)*0.833*vf).toFixed(2), unit:'lbs', reason:`Raise CYA ${current.cya} → ${desired.cya} ppm` });
  }
  // Liquid Chlorine 10% — 12.8 fl oz per 1 ppm per 10k gal (calibrated: 25.60 fl oz for FC 1→3 at 10k)
  if (current.fc < desired.fc - 0.5) {
    recs.push({ chem:'Liquid Chlorine (10%)', amount:+((desired.fc - current.fc)*12.8*vf).toFixed(1), unit:'fl oz', reason:`Raise FC ${current.fc.toFixed(1)} → ${desired.fc.toFixed(1)} ppm` });
  }
  // Pool Salt — 8.345 lbs per 100 ppm per 10k gal (calibrated: 66.76 lbs for salt 2400→3200 at 10k)
  if (current.tds > 0 && current.tds < desired.tds - 200) {
    recs.push({ chem:'Pool Salt (NaCl)', amount:+(((desired.tds - current.tds)/100)*8.345*vf).toFixed(1), unit:'lbs', reason:`Raise salt ${current.tds} → ${desired.tds} ppm` });
  }
  return recs;
}

// ─── ORENDA LSI COLORS ─────────────────────────────────────────────────────
function lsiMeta(lsi) {
  if (lsi <= -0.31) return { label:'CORROSIVE',     color: B.lsiRed,    bg: B.lsiRed };
  if (lsi <= -0.01) return { label:'ACCEPTABLE',    color: B.lsiYellow, bg: B.lsiYellow };
  if (lsi <= 0.30)  return { label:'BALANCED',      color: B.lsiGreen,  bg: B.lsiGreen };
  return                    { label:'SCALE FORMING', color: B.lsiPurple, bg: B.lsiPurple };
}

// ─── pH CEILING ────────────────────────────────────────────────────────────
function phCeiling(ta, cya) {
  const carbAlk = Math.max(ta - Math.round(cya / 3), 5);
  return +(Math.min(8.4, 7.5 + (carbAlk - 80) * 0.005)).toFixed(2);
}

// ─── COMPONENTS ────────────────────────────────────────────────────────────
function DialInput({ value, step, min, max, onChange, decimals=0 }) {
  const lo = Math.max(min, +(value - step).toFixed(4));
  const hi = Math.min(max, +(value + step).toFixed(4));
  const fmt = (v) => decimals > 0 ? v.toFixed(decimals) : String(v);
  return (
    <div style={S.dialGroup}>
      <div style={S.dialSide} onClick={() => onChange(lo)}>{fmt(lo)}</div>
      <div style={S.dialCenter}>{fmt(value)}</div>
      <div style={S.dialSide} onClick={() => onChange(hi)}>{fmt(hi)}</div>
    </div>
  );
}

function CustomInput({ value, step, min, max, onChange, decimals=0 }) {
  const fmt = (v) => decimals > 0 ? v.toFixed(decimals) : String(v);
  const dec = () => onChange(Math.max(min, +(value - step).toFixed(4)));
  const inc = () => onChange(Math.min(max, +(value + step).toFixed(4)));
  const handleChange = (e) => {
    const v = parseFloat(e.target.value);
    if (!isNaN(v) && v >= min && v <= max) onChange(+(v.toFixed(decimals > 0 ? decimals : 0)));
  };
  return (
    <div style={S.customGroup}>
      <button style={S.arrowBtn} onClick={dec}>‹</button>
      <input style={S.customInput} value={fmt(value)} onChange={handleChange} type="number" inputMode="decimal" />
      <button style={S.arrowBtn} onClick={inc}>›</button>
    </div>
  );
}

function ParamInput({ mode, value, step, min, max, onChange, decimals }) {
  return mode === 'dials'
    ? <DialInput value={value} step={step} min={min} max={max} onChange={onChange} decimals={decimals} />
    : <CustomInput value={value} step={step} min={min} max={max} onChange={onChange} decimals={decimals} />;
}

function VolField({ label, value, onChange, unit='ft', step=1 }) {
  return (
    <div style={{display:'flex', alignItems:'center', gap:8}}>
      <div style={{flex:'1 1 0', fontSize:12, fontWeight:600, color:B.teal}}>{label}</div>
      <input type="number" inputMode="decimal" value={value} step={step}
        onChange={e => { const v = parseFloat(e.target.value); if (!isNaN(v) && v >= 0) onChange(v); }}
        style={{width:64, textAlign:'center', background:B.navyLight, border:`1px solid ${B.grayDim}`, borderRadius:8,
          padding:'6px 8px', color:B.white, fontFamily:"'Jost',sans-serif", fontSize:14, fontWeight:700, outline:'none'}} />
      <div style={{fontSize:12, color:B.grayMid, width:20}}>{unit}</div>
    </div>
  );
}

    if (volShape === 'oblong') { const avgD = (v.deepDepth + v.shallowDepth) / 2; return +(v.length * ((v.diamA + v.diamB) / 2) * avgD * GAL * 0.9).toFixed(0); }

                  <span style={{fontWeight:700}}>LSI</span>
                  <span style={{fontWeight:800, color:desiredMeta.color}}>{desiredLSI.lsi.toFixed(2)}</span>
                </div>
              </div>
            </div>
          </>
        )}

        {/* INFO TAB */}
        {tab === 'info' && (
          <>
            <div style={{fontSize:13, fontWeight:700, color:B.white, marginBottom:10}}>LSI Color Guide</div>
            <div style={S.infoRow}>
              <div style={S.infoDot(B.lsiPurple)} />
              <div style={S.infoText}>
                <div style={S.infoLabel}>Purple — Scale Forming (≥ +0.31)</div>
                Over-saturated with calcium carbonate. Scale will form on surfaces, equipment, and plumbing. Lower pH or reduce calcium/TA.
              </div>
            </div>
            <div style={S.infoRow}>
              <div style={S.infoDot(B.lsiGreen)} />
              <div style={S.infoText}>
                <div style={S.infoLabel}>Green — Ideal Balance (0.00 to +0.30)</div>
                Water is happy. Slightly positive LSI protects plaster surfaces. This is the target zone.
              </div>
            </div>
            <div style={S.infoRow}>
              <div style={S.infoDot(B.lsiYellow)} />
              <div style={S.infoText}>
                <div style={S.infoLabel}>Yellow — Acceptable (-0.30 to -0.01)</div>
                Slightly under-saturated. pH will naturally rise toward green over time. Monitor and adjust if it trends lower.
              </div>
            </div>
            <div style={S.infoRow}>
              <div style={S.infoDot(B.lsiRed)} />
              <div style={S.infoText}>
                <div style={S.infoLabel}>Red — Corrosive (≤ -0.31)</div>
                Aggressive water — hungry for calcium. Will etch plaster, corrode metal, and damage equipment. Raise calcium, TA, or pH immediately.
              </div>
            </div>
            <div style={{marginTop:12, fontSize:11, color:B.grayDim, lineHeight:1.5}}>
              The Langelier Saturation Index measures water's tendency to dissolve or deposit calcium carbonate. 
              LSI = pH + TF + CF + AF − 12.1. Factors are derived from PHTA lookup tables for temperature, calcium hardness, and alkalinity (adjusted for CYA contribution).
            </div>
          </>
        )}

        {/* VOLUME TAB */}
        {tab === 'volume' && (
          <>
            <div style={{fontSize:13, fontWeight:700, color:B.white, marginBottom:10}}>Pool Volume Estimator</div>
            <div style={{fontSize:11, color:B.grayMid, marginBottom:12}}>Select pool shape, then adjust values to estimate volume.</div>

            {/* Shape selector */}
            <div style={{display:'flex', gap:6, marginBottom:14}}>
              {[['circle','Circle'],['oblong','Oblong'],['rect','Rectangle']].map(([k,lbl]) => (
                <button key={k} onClick={() => setVolShape(k)} style={{
                  flex:1, padding:'8px 4px', borderRadius:8, border:`1px solid ${volShape===k?B.teal:B.navyLight}`,
                  background:volShape===k?B.teal:'transparent', color:volShape===k?B.white:B.grayMid,
                  fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:"'Jost',sans-serif"
                }}>{lbl}</button>
              ))}
            </div>

            {/* Inputs per shape */}
            <div style={{display:'flex', flexDirection:'column', gap:8}}>
              {volShape === 'circle' && (
                <>
                  <VolField label="Radius (R)" value={volInputs.radius} onChange={v => updateVolInput('radius',v)} unit="ft" />
                  <VolField label="Avg Depth" value={volInputs.avgDepth} onChange={v => updateVolInput('avgDepth',v)} unit="ft" step={0.5} />
                </>
              )}
              {volShape === 'oblong' && (
                <>
                  <VolField label="Length (L)" value={volInputs.length} onChange={v => updateVolInput('length',v)} unit="ft" />
                  <VolField label="Large Diameter (A)" value={volInputs.diamA} onChange={v => updateVolInput('diamA',v)} unit="ft" />
                  <VolField label="Small Diameter (B)" value={volInputs.diamB} onChange={v => updateVolInput('diamB',v)} unit="ft" />
                  <VolField label="Deep Depth" value={volInputs.deepDepth} onChange={v => updateVolInput('deepDepth',v)} unit="ft" step={0.5} />
                  <VolField label="Shallow Depth" value={volInputs.shallowDepth} onChange={v => updateVolInput('shallowDepth',v)} unit="ft" step={0.5} />
                </>
              )}
              {volShape === 'rect' && (
                <>
                  <VolField label="Length (L)" value={volInputs.length} onChange={v => updateVolInput('length',v)} unit="ft" />
                  <VolField label="Width (W)" value={volInputs.width} onChange={v => updateVolInput('width',v)} unit="ft" />
                  <VolField label="Deep Depth" value={volInputs.deepDepth} onChange={v => updateVolInput('deepDepth',v)} unit="ft" step={0.5} />
                  <VolField label="Shallow Depth" value={volInputs.shallowDepth} onChange={v => updateVolInput('shallowDepth',v)} unit="ft" step={0.5} />
                </>
              )}
            </div>

            {/* Result */}
            <div style={{textAlign:'center', margin:'18px 0 10px'}}>
              <div style={{fontSize:28, fontWeight:800, color:B.teal}}>{Number(calcVolume).toLocaleString()}</div>
              <div style={{fontSize:13, color:B.grayMid}}>gallons</div>
            </div>

            {/* Use button */}
            <button onClick={() => { setVolume(Math.round(calcVolume)); setTab('dosing'); }}
              style={{...S.calcBtn, margin:'8px auto 4px', padding:'10px', fontSize:14}}>
              Use This Volume
            </button>
          </>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(SWPChemistryApp));
</script>
</body>
</html>
